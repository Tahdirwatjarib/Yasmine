story:()=>`<div class="intro">Dies ist meine persönliche Darstellung dessen, was ich erlebt, gelesen, gesehen und später mit anderen Beteiligten besprochen habe. Ich schreibe nicht, um Hass zu erzeugen, sondern weil ich rückblickend gern früher die Informationen gehabt hätte, die meine Entscheidung über Liebe, Verlobung und Ehe verändert hätten.</div>${commonQuran.de}
<h2>Wie alles begann</h2><p>Wir lernten uns über Muslima.com kennen – eine Plattform, auf der viele Menschen ausdrücklich nach einer ernsthaften muslimischen Ehe suchen. Genau dieser Rahmen war für mich wichtig. Ich suchte keine lockere Bekanntschaft und keine kurze Online-Romanze, sondern eine Frau, mit der eine gemeinsame Zukunft und eine Ehe möglich sein könnten.</p><p>Aus dem ersten Kontakt wurde schnell ein fester Teil meines Alltags. Über mehr als ein Jahr hatten wir nahezu täglich Kontakt. Wir schrieben viel, telefonierten oft lange und hatten regelmäßig Videoanrufe, teilweise bis spät in die Nacht. Es gab nicht nur einzelne intensive Tage, sondern eine lange Kontinuität. Gerade diese tägliche Verlässlichkeit ließ bei mir Vertrauen wachsen.</p><p>Im Laufe dieses langen Kontakts erzählte Yasmine mir auch viele persönliche Dinge über ihr Leben. Sie sagte mir, dass sie als Sportlehrerin arbeitet und zuvor auch als Coach beziehungsweise Trainerin in einem Fitnessstudio tätig war. Außerdem sagte sie mir, dass sie einen Bruder und eine Schwester hat. Solche persönlichen Einzelheiten gehörten zu den vielen Dingen, über die wir während unseres nahezu täglichen Kontakts sprachen.</p><p>Auch ihr Beruf trug damals zu meinem Vertrauen bei. Auf mich wirkte eine Tätigkeit als Lehrerin und Trainerin seriös und verantwortungsbewusst. Ich rechnete gerade bei jemandem in einem pädagogischen Beruf nicht mit dem, was ich später in den Chats, Audios, Videos und anderen Unterlagen zu sehen und zu hören bekam.</p><p>Es ging immer wieder um Liebe, Heirat, Kinder und eine gemeinsame Zukunft. Es gab Herzen, Kosenamen, Zärtlichkeit und Aussagen, die ich als klare Liebeserklärungen verstand. Wir sprachen nicht nur allgemein darüber, irgendwann einmal zu heiraten. Für mich entwickelte sich daraus zunehmend die Vorstellung, dass wir tatsächlich auf eine gemeinsame Ehe zusteuerten.</p><p>Ich plante innerlich längst nicht mehr nur ein erstes Treffen. Ich dachte darüber nach, wie ein gemeinsames Leben aussehen könnte, wie wir unsere Zeit miteinander verbringen würden und welche Schritte bis zu einer Verlobung und späteren Ehe nötig wären. Je länger der Kontakt dauerte, desto mehr Zeit, Gefühle und Vertrauen investierte ich.</p><p>Mit der Zeit wurden die Gespräche auch zunehmend intim, einschließlich erotischer Telefonate und Telefonsex. Worte wie „Aktar, aktar, aktar – mehr, mehr, mehr“ und „Ya omri – mein Leben“ blieben mir im Gedächtnis. Die Verbindung aus emotionaler Nähe, Heiratsversprechen und Sexualität verstärkte bei mir den Eindruck, dass wir nicht nur miteinander flirteten, sondern auf eine feste Partnerschaft und Ehe zusteuerten.</p><h2>Liebe, Geld und konkrete Zukunftspläne</h2><p>Parallel kamen immer wieder finanzielle Themen: Medikamente, Telefon, Cremes, Geschenke und andere Ausgaben. Ich schickte Geld und Geschenke, weil ich glaubte, einer Frau zu helfen, die ich liebte und mit der ich eine Zukunft plante. Für mich waren diese Hilfen Teil einer Beziehung, die ich als ernst und auf Ehe ausgerichtet verstand.</p><p>Dadurch bekam Geld für mich damals eine völlig andere Bedeutung als heute im Rückblick. Ich dachte nicht in Kategorien von Geben und Nehmen, sondern in Kategorien von Fürsorge. Wenn die Frau, die man heiraten möchte, sagt, sie brauche etwas, fällt es viel leichter zu helfen, weil man glaubt, bereits Verantwortung füreinander zu übernehmen.</p><p>Für meine Reise nach Algier bat Yasmine mich, eine private Wohnung zu mieten und vorher ausdrücklich zu prüfen, ob Besucher erlaubt seien. Sie erklärte mir, dass wir uns dort leichter treffen und ungestört Zeit miteinander verbringen könnten. Zusätzlich wollte sie, dass ich einen Mietwagen organisiere, damit wir unabhängiger wären und uns einfacher bewegen könnten.</p><p>Der Wunsch nach einer privaten Wohnung war für mich deshalb besonders aussagekräftig, weil es nicht nur darum ging, irgendwo zu übernachten. Es ging ausdrücklich darum, einen Ort zu haben, an dem wir uns treffen und Ruhe miteinander haben konnten. Zusammen mit dem Wunsch nach einem Mietwagen wirkte das auf mich wie eine sehr konkrete Planung unseres gemeinsamen Aufenthalts.</p><p>Für mich waren das keine bloßen Zukunftsphantasien mehr. Ich plante die Reise und die Unterkunft und richtete mich bei der Vorbereitung nach ihren Wünschen. Gerade dadurch wirkte die Beziehung auf mich noch verbindlicher und ernster.</p><div class="strong">Ich glaubte nicht an ein Spiel. Ich glaubte an eine zukünftige Ehe und handelte entsprechend.</div><h2>Algier, Nähe und der Tarzan-Park</h2><p>Nach mehr als einem Jahr flog ich nach Algier. Für mich war diese Reise der Schritt von einer langen Fernbeziehung in die reale gemeinsame Zukunft, über die wir so oft gesprochen hatten. Ich hatte über Monate Gefühle, Zeit und Vertrauen aufgebaut und wollte nun erleben, was wir vorher immer wieder als gemeinsame Zukunft beschrieben hatten.</p><p>Als wir uns trafen, umarmten und küssten wir uns und hatten Sex. Für mich als Muslim war das keine belanglose Begegnung. Sex gehört für mich eigentlich in die Ehe. Gerade deshalb deutete ich diese Nähe zusammen mit den fortgesetzten Heiratsversprechen als etwas sehr Ernstes. Ich dachte nicht, dass ich lediglich einer von mehreren Männern bei einem unverbindlichen Treffen war.</p><p>Yasmine wollte, dass wir uns bereits am folgenden Tag verloben. Ich war damit einverstanden. Schon vorher hatte ich sie gefragt, welche Art von Verlobungsring ihr gefällt und welche Ringgröße sie trägt. Sie wusste also, dass ich einen Antrag plante, und war mit der Verlobung einverstanden. Für mich passte das zu allem, was vorher über Liebe, Heirat und Zukunft gesagt worden war und bestätigte meinen damaligen Eindruck, dass es ihr mit einer Ehe ernst sei.</p><p>Am nächsten Tag waren wir im Jardin d’Essai du Hamma – dem Park, den viele mit den alten Tarzan-Filmen verbinden. Damals dachte ich, dies sei unser besonderer romantischer Ort. Der Tag blieb mir besonders im Gedächtnis, weil ich ihn mit der gemeinsamen Zukunft verband, an die ich glaubte.</p><p>Ich dachte zu diesem Zeitpunkt bereits konkret über einen Verlobungsring nach. Bei der Ringgröße erinnere ich mich daran, dass die Zahl auf 8 endete; ich meine, dass es 48 war. Hundertprozentig sicher bin ich mir bei dieser einen Zahl heute nicht mehr. Sicher bin ich mir aber daran, dass ich mich bereits mit einer echten Verlobung beschäftigte und diese nicht nur als unverbindliches Gespräch betrachtete.</p><p>Doch noch bevor es zu dem geplanten Antrag kam, wurden mir umfangreiche Inhalte aus Yasmines Handy und ihrer Kommunikation mit männlichen Kontakten zugesendet – darunter Chats, Screenshots, Bilder, Audios und Videos. Was ich darin sah und hörte, veränderte meine Situation vollständig. Einen Tag vor dem geplanten Verlobungsantrag entschied ich mich deshalb, meinen Rückflug umzubuchen und Algier vorzeitig zu verlassen.</p><p>Die Bestätigung dieser Flugumbuchung liegt mir vor und kann demnächst anonymisiert als zeitlicher Beleg gezeigt werden. Sie dokumentiert, dass ich meine Reise unmittelbar vor dem geplanten Antrag vorzeitig abbrach.</p><p>Yasmine reagierte sehr wütend darauf, dass ich vorzeitig abreiste und ihr keinen Verlobungsantrag mehr machte. Gerade dieser Ablauf ist für mich wichtig: Bis unmittelbar vor dem Erhalt dieser Inhalte plante ich die Verlobung. Erst das Material, das mir zugesendet wurde, führte dazu, dass ich meine Entscheidung änderte.</p><h2>Was ich später entdeckte</h2><p>Später bekam ich Einblick in Inhalte auf Yasmines Handy – insbesondere in ihre Kommunikation mit männlichen Kontakten. Dabei ging es um Chats, Screenshots, Bilder, Audios und Videos. Zusätzlich sprach ich mit anderen Männern, die mir eigene Nachrichten, Fotos und Erfahrungen zeigten oder beschrieben. Je mehr Material ich sah, desto stärker veränderte sich mein Bild von der Beziehung.</p><p>Für mich war entscheidend, dass es nicht um irgendein fremdes Handy oder allgemein um Gerüchte über soziale Medien ging. Es ging um Inhalte aus Yasmines Handy und um ihre direkten Kontakte und Gespräche mit Männern. Viele dieser Inhalte standen in deutlichem Gegensatz zu dem Bild, das ich während unserer Beziehung von Exklusivität, Liebe und Heirat gehabt hatte.</p><p>Mein Eindruck aus dem Material war nicht mehr, dass es sich nur um einzelne Missverständnisse oder frühere Bekanntschaften handelte. Nach meiner eigenen Auswertung bestanden zeitweise ungefähr 50 männliche Kontakte parallel; über einen längeren Zeitraum sammelten sich Hunderte männliche Kontakte an. Diese Zahl ist meine Auswertung des Materials und bedeutet nicht, dass jeder einzelne Kontakt dieselbe Bedeutung hatte.</p><div class="strong">Für mich war die schmerzhafte Erkenntnis klar: Ich war einer von vielen.</div><p>Viele Kontakte waren offenbar nicht einmal mit Namen gespeichert. Allgemeine Kosenamen wie „Baby“, „BB“ oder „mein Leben“ tauchten immer wieder auf. Auf mich wirkte das wie eine praktische Art, mit einer großen Zahl paralleler Kontakte umzugehen, ohne sich ständig unterschiedliche Namen merken zu müssen. Selbst meinen Namen schrieb Yasmine nach langer Zeit einmal falsch.</p><p>Andere Männer schilderten mir Treffen, romantische Kommunikation und intime beziehungsweise sexuelle Kontakte. Einige zeigten mir dazu eigene Nachrichten oder Bilder. Auch der Jardin d’Essai du Hamma tauchte wieder auf. Das traf mich besonders, weil ich diesen Ort vorher als etwas Besonderes zwischen uns verstanden hatte.</p><p>Nach den Nachrichten, Bildern und meinen Gesprächen mit anderen Männern war für mich klar, dass Yasmine vor mir bereits andere sexuelle Partner gehabt hatte und dass intime beziehungsweise sexuelle Kontakte teilweise sogar in denselben Zeitraum fielen, in dem sie mir Liebe, Treue und Heirat versprach.</p><p>Genau dieser zeitliche Zusammenhang war für mich entscheidend. Es ging nicht nur um die Frage, was irgendwann vor meiner Zeit gewesen war. Es ging darum, welche Kontakte und welche Art von Nähe während einer Zeit e wird stärker: erotische Gespräche, Telefonsex, sexuelle Versprechen, Treffen, Küsse und schließlich Sex. Für mich verstärkte das den Glauben an die Ernsthaftigkeit der Beziehung.</div><div class="phase"><strong>Phase 3 – Ein Problem entsteht</strong>Immer wieder taucht etwas auf, wofür Hilfe benötigt wird: Krankheit, Medikamente, Telefon, Familie oder eine andere dringende Ausgabe. In einer vermeintlich festen Beziehung fällt es schwer, einfach Nein zu sagen.</div><div class="phase"><strong>Phase 4 – Geld und Geschenke</strong>Finanzielle Hilfe und Geschenke fühlen sich zunehmend wie ein Beweis von Fürsorge und Liebe an. Wer helfen will, kann das Gefühl bekommen, damit auch die Beziehung zu stärken.</div><div class="phase"><strong>Phase 5 – Kälte</strong>Dann kann die Stimmung kippen: weniger Zeit, kürzere Antworten, weniger Herzen und mehr Distanz. Nach vorheriger starker Nähe entsteht dadurch Unsicherheit.</div><div class="phase"><strong>Phase 6 – Neue Wärme</strong>Danach kommen wieder Zärtlichkeit, Liebe, Erotik, Zukunftspläne und Versprechen. Für mich entstand so ein Kreislauf aus Nähe, Unsicherheit und erneuter Hoffnung.</div></div>
<h2>Der entscheidende Punkt</h2><p>Der größte Schaden ist für mich nicht eine einzelne Zahlung und nicht ein einzelnes Geschenk. Es ist der Verlust einer informierten Entscheidung. Wer eine Ehe plant, muss wissen dürfen, in welcher Realität er diese Entscheidung trifft.</p><p>Yasmine hätte jederzeit sagen können: Ich liebe dich nicht. Ich will dich nicht heiraten. Ich treffe viele andere Männer. Ich habe oder hatte parallele Beziehungen oder intime Kontakte. Dann hätte es wehgetan, aber ich hätte auf Grundlage der Wahrheit entscheiden können.</p><p>Stattdessen lebte ich lange in einer Vorstellung, die ich für gegenseitig hielt. Ich glaubte an Exklusivität, an einen gemeinsamen Weg und an die konkrete Möglichkeit einer Verlobung. Genau deshalb war die spätere Erkenntnis für mich nicht bloß Eifersucht oder Enttäuschung, sondern der Zusammenbruch einer Zukunft, die ich bereits ernsthaft geplant hatte.</p><p>Für mich gehört zu echter Liebe auch, dem anderen die Freiheit zu lassen, auf Basis der Wahrheit Ja oder Nein zu sagen. Wer wichtige Informationen verschweigt, nimmt dem anderen einen Teil dieser Freiheit.</p><div class="quote">Geld und Sex dürfen nicht als Liebe verkauft werden.</div><p>Und ich frage mich bis heute: Wissen die Menschen, die Yasmine wirklich lieben, überhaupt von dieser Seite ihres Lebens? Ihre Familie ist selbstverständlich nicht automatisch für die Entscheidungen eines erwachsenen Menschen verantwortlich.</p><h2>Eine unbequeme Frage</h2><p>Wie kann man vor einer Ehe wirklich wissen, ob das Bild, das einem über die Vergangenheit eines Menschen vermittelt wird, stimmt? Medizinische Untersuchungen können eine sexuelle Vergangenheit nicht zuverlässig feststellen, und auch ein Lügendetektor schafft keine absolute Sicherheit.</p><p>Wer mehr als bloßes Vertrauen möchte, kann sich deshalb letztlich nur an <strong>nachprüfbare Tatsachen und vorhandene Dokumentation</strong> halten: frühere Nachrichten und Chats, Zeitabläufe, Fotos, Audios, Videos, Reise- oder andere Belege sowie Aussagen von Personen, die selbst beteiligt waren – soweit dieses Material rechtmäßig vorliegt.</p><p>Genau das änderte bei mir alles. Erst als ich Einblick in konkrete Inhalte aus Yasmines Handy und ihre Kommunikation mit männlichen Kontakten bekam, konnte ich das Bild, das mir zuvor vermittelt worden war, mit dem vergleichen, was tatsächlich dokumentiert war.</p><div class="quote">Vertrauen ist wichtig. Aber wenn Zweifel entstehen, sagen überprüfbare Tatsachen mehr als Versprechen.</div><h2>Originalmaterial und Gegendarstellung</h2><p>Zu meiner Dokumentation gehören Chats, Screenshots, Bilder, Audios und Videos aus dem Zusammenhang mit Yasmines Handy und ihren männlichen Kontakten sowie Gespräche mit Männern, die mir eigenes Material und eigene Erfahrungen zeigten. Ein Teil davon ist auf dieser Seite bewusst anonymisiert, damit unbeteiligte Personen und private Kontaktdaten nicht unnötig offengelegt werden.</p><p>Ich halte den vollständigen Zusammenhang für wichtig. Einzelne Sätze oder Screenshots können missverstanden werden. Deshalb sind für mich Zeitabläufe, wiederkehrende Formulierungen, Bilder, Audios, Videos und die Aussagen anderer Beteiligter gemeinsam entscheidend.</p><p>Wenn Yasmine einer konkreten Veröffentlichung unserer gemeinsamen privaten und intimen Kommunikation ausdrücklich und schriftlich zustimmt, bin ich bereit, dieses Material offenzulegen. Dann dürfen auch meine eigenen Worte, meine Stimme und meine Beteiligung sichtbar sein. Mir geht es dabei nicht um sexuelle Bloßstellung. Mir geht es darum, dass Originalmaterial und Chronologie im Streitfall zeigen können, was tatsächlich gesagt und getan wurde.</p><div class="quote">Die Wahrheit muss keine Angst vor dem vollständigen Zusammenhang haben.</div><p>Wenn Yasmine eine andere Version schildert, soll niemand mir einfach blind glauben. Prüft Chronologie, Nachrichten, Bilder, Audios, Videos und Zusammenhänge. Eine Gegendarstellung kann über die Meldefunktion übermittelt werden und sollte konkret benennen, welche Aussage oder welches Bild anders dargestellt werden soll.</p><h2>Persönliche Angriffe ändern die Belege nicht</h2><p>Ein wesentlicher Teil von Yasmines Reaktion besteht aus meiner Sicht darin, mich persönlich als psychisch instabil oder als „Psycho“ darzustellen. Damit wird die Diskussion von den konkreten Nachrichten, Audios, Bildern, Zeitabläufen und Kontakten weg auf meine Person gelenkt.</p><p>Ob dies bewusst geschieht, um das gesellschaftliche Bild zu schützen, das sie nach außen vermittelt, kann ich nicht wissen. Wenn die dokumentierten Inhalte jedoch im Widerspruch zu diesem Bild stehen, lösen persönliche Bezeichnungen über mich diesen Widerspruch nicht auf.</p><p>Für die Frage, was tatsächlich passiert ist, ist deshalb nicht entscheidend, welche Bezeichnung Yasmine für mich verwendet. Entscheidend sind überprüfbare Inhalte, die Chronologie und vorhandene Belege. Auch meine eigene Darstellung soll daran gemessen werden.</p><h2>Behördliche Prüfung</h2><p>Nachdem ich mit Männern gesprochen, Nachrichten und Bilder gesehen und von weiteren Treffen erfahren hatte, stellte sich für mich die Frage: Wie viele Betroffene gibt es tatsächlich? Was haben die einzelnen Männer erlebt? Welche finanziellen oder emotionalen Schäden sind entstanden? Deshalb habe ich den Sachverhalt gemeldet, damit geprüft werden kann, was belegbar und rechtlich relevant ist.</p>
<h2>Chronologie in Kurzform</h2><div class="timeline">Über ein Jahr nahezu täglicher Kontakt → lange Telefonate und Videoanrufe → Liebes- und Heiratsversprechen → Gespräche über Kinder und Zukunft → zunehmend intime Telefonate und Telefonsex → Geld und Geschenke → konkrete Reiseplanung mit privatem Apartment, ausdrücklich erlaubten Besuchern und dem Wunsch nach einem Mietwagen → Treffen in Algier → Küssen und Sex → Yasmine wollte eine Verlobung bereits am folgenden Tag, womit ich einverstanden war → ich hatte sie nach gewünschtem Verlobungsring und Ringgröße gefragt → romantischer Tag im Jardin d’Essai du Hamma → geplanter Verlobungsantrag → Zusendung von Inhalten aus Yasmines Handy und ihrer Kommunikation mit männlichen Kontakten → einen Tag vor dem geplanten Antrag Umbuchung des Rückflugs und vorzeitige Abreise aus Algier → Chats, Screenshots, Bilder, Audios und Videos → Gespräche mit weiteren Männern und deren Unterlagen → Erkenntnis, dass ich einer von vielen war.</div><h2>Was mich am meisten verletzt hat</h2><p>Nicht das Geld. Nicht die Geschenke. Es war das Vertrauen. Mehr als ein Jahr meines Lebens hing an der Vorstellung von Liebe, Verlobung, Ehe und Familie. Ich hatte nicht nur Gefühle investiert, sondern Zeit, Planung, Reise, Geld und die Vorstellung eines gemeinsamen Lebens.</p><p>Als dieses Bild zerbrach, musste ich im Nachhinein viele Gespräche, Versprechen und Erinnerungen völlig neu bewerten. Dinge, die vorher romantisch wirkten, bekamen plötzlich eine andere Bedeutung. Gerade weil die Beziehung so lange gedauert hatte und so viele konkrete Zukunftsaussagen gefallen waren, war diese Neubewertung für mich besonders schmerzhaft.</p><p>Ich fragte mich rückblickend, welche Momente nur für mich etwas Besonderes gewesen waren und welche Worte gleichzeitig auch zu anderen Männern gesagt worden waren. Das war schwerer zu verarbeiten als eine einzelne finanzielle Enttäuschung.</p><p>Und ja, ich habe wegen Yasmine geweint.</p><p>Gerade eine muslimische Plattform erzeugt zusätzlich Vertrauen. Man erwartet Amanah – Vertrauenswürdigkeit. Am Ende kennt nur Allah die Herzen. Aber Menschen müssen ihre Entscheidungen anhand dessen treffen, was ihnen gesagt und gezeigt wird.</p><h2>Was ich anderen Männern raten würde</h2><p>Seid aufmerksam, wenn sehr früh von großer Liebe, Ehe und Kindern gesprochen wird; wenn gleichzeitig starke sexuelle Bindung entsteht; wenn immer wieder finanzielle Probleme auftauchen; wenn Geld oder Geschenke zu einem Beweis von Liebe werden; wenn nach einem Nein plötzlich Kälte entsteht; oder wenn Namen und Geschichten durcheinandergeraten.</p><div class="strong">Meine Loyalität macht einen anderen Menschen nicht loyal. Meine Ehrlichkeit macht einen anderen Menschen nicht ehrlich. Meine Liebe zwingt niemanden dazu, mich zu lieben. Liebe ist kein Vertrag, den einer alleine unterschreiben kann.</div>`,

caps:["Yasmine knows the effect she can have on men – that is how I experienced her self-presentation.","Jardin d’Essai du Hamma, often associated with the old Tarzan films. In my experience, a place Yasmine liked for romantic meetings.","An example from our chat: her phone was supposedly broken.","Yasmine at one of her meetings.","Another chat about collecting money for a new phone.","One of many chats I later saw: romantic language and the planning of another meeting.","Another chat discussing contact, a meeting point and travel arrangements.","An Instagram story with a kitten on her lap. To me, the presentation felt deliberately flirtatious and suggestive – that is my personal interpretation.","Yasmine with one of her contacts in Jardin d’Essai du Hamma. I found it striking that the same romantic place appeared to play a role with other contacts as well.","One of at least two Muslima.com accounts that I associated with Yasmine.","Yasmine tells me that she likes kissing at any time.","When I did not contact her for several days, she reacted very emotionally and demanded daily attention. I later felt I recognised similar patterns in other chats.","No words: an intimate message from our chat that affected me deeply.","Another intimate chat about kissing, physical closeness and the idea of having a child together."],
story:()=>`<div class="intro">This is my personal account of what I experienced, read, saw and later discussed with other people involved. I am not writing to create hatred, but because I wish I had known earlier the information that would have changed my decisions about love, engagement and marriage.</div>${commonQuran.en}
<h2>How it began</h2><p>We met on Muslima.com, a platform used by many people specifically looking for serious Muslim marriage. That context mattered to me. I was not looking for a casual online romance, but for a woman with whom a real future and marriage might be possible.</p><p>For more than a year we were in contact almost every day. We exchanged many messages, had long phone calls and regular video calls, sometimes late into the night. It was the continuity over such a long period that built trust for me and made the relationship feel real rather than occasional.</p><p>During this long period of contact, Yasmine also told me many personal details about her life. She told me that she works as a sports teacher and had previously also worked as a coach or trainer in a fitness centre. She also told me that she has one brother and one sister. Details like these were among the many personal things we discussed during our almost daily contact.</p><p>Her profession also contributed to the trust I placed in her at the time. To me, working as a teacher and trainer suggested seriousness and responsibility. I did not expect, especially from someone working in an educational profession, what I later saw and heard in the chats, audio recordings, videos and other material.</p><p>We repeatedly spoke about love, marriage, children and a shared future. There were hearts, pet names, affection and statements I understood as clear declarations of love. I was no longer merely thinking about meeting her; I was thinking about what a life together could look like and what steps might lead to engagement and marriage.</p><p>Over time the conversations also became increasingly intimate, including erotic calls and phone sex. The combination of emotional closeness, promises of marriage and sexual intimacy strengthened my belief that we were moving toward a committed relationship and marriage.</p><h2>Love, money and concrete plans</h2><p>Financial requests appeared repeatedly: medicine, a phone, creams, gifts and other expenses. I sent money and gifts because I believed I was helping a woman I loved and intended to marry. At the time, I understood those expenses as care within a serious relationship.</p><p>For my trip to Algiers, Yasmine asked me to rent a private apartment and specifically make sure in advance that visitors were allowed. She told me that this would make it easier for us to meet and spend time together in peace and privacy. She also wanted me to arrange a rental car so that we could be more independent and move around more easily.</p><p>The private apartment mattered to me because the point was not simply accommodation. It was specifically about having a place where we could meet and have time alone together. Together with her request for a rental car, this felt like concrete planning for our shared stay.</p><p>I planned the trip and accommodation around what we had discussed. To me, these were no longer vague future promises but practical preparations for a relationship that I believed was heading toward marriage.</p><div class="strong">I did not think I was participating in a game. I believed I was preparing for a future marriage and acted accordingly.</div><h2>Algiers and intimacy</h2><p>After more than a year I flew to Algiers. For me, the trip was the step from a long-distance relationship into the real shared future we had discussed so often. When we met, we hugged, kissed and had sex.</p><p>As a Muslim, I did not view that as casual. Sex, for me, belongs within marriage. Combined with the continuing promises of marriage, I understood the intimacy as something very serious and as part of the future I believed we were building.</p><p>Yasmine wanted us to become engaged the following day. I agreed. Before that, I had already asked her what kind of engagement ring she liked and what ring size she wore. She therefore knew that I was planning a proposal and agreed with the engagement. To me, that fitted with everything that had previously been said about love, marriage and the future and reinforced my belief that the relationship was serious.</p><p>The next day we visited Jardin d’Essai du Hamma. At the time, I believed it was our special romantic place. I was already seriously thinking about an engagement ring; I remember the size ending in 8 and believe it was 48, although I am no longer completely certain about that one number.</p><p>Before the planned proposal could take place, however, extensive material from Yasmine's phone and her communication with male contacts was sent to me, including chats, screenshots, images, audio and video. What I saw and heard changed the situation completely for me. One day before the planned proposal, I decided to rebook my return flight and leave Algiers early.</p><p>I have the confirmation of that flight rebooking and can add it shortly in anonymised form as chronological evidence. It documents that I cut my trip short immediately before the planned proposal.</p><p>Yasmine reacted very angrily to my leaving early and no longer proposing to her. This sequence matters to me: until immediately before receiving that material, I was planning the engagement. It was the material sent to me that caused me to change my decision.</p><h2>What I discovered later</h2><p>Later I gained access to material on Yasmine's phone, particularly her communication with male contacts. This included chats, screenshots, images, audio and video. I also spoke with other men who showed or described their own messages, photos and experiences. The more material I saw, the more my understanding of the relationship changed.</p><p>For me, this was important because it was not simply gossip or general claims on social media. It concerned material from Yasmine's phone and her direct communication with male contacts. Much of what I saw conflicted with the picture of exclusivity, love and marriage that I had believed in.</p><p>My own review suggested that at times around 50 male contacts existed in parallel, with hundreds accumulating over a longer period. That number is my assessment of the material and does not mean that every single contact had the same significance.</p><div class="strong">For me, the painful conclusion was clear: I was one of many.</div><p>Many contacts did not even appear to be saved under proper names. Generic pet names appeared repeatedly. Even my own name was once written incorrectly after a long period of contact.</p><p>Other men described meetings, romantic communication and intimate or sexual contacts. Some showed me their own messages or images. Jardin d’Essai du Hamma appeared again as well, which was particularly painful because I had understood it as something special between us.</p><p>Based on the messages, images and my conversations with other men, I concluded that Yasmine had already had other sexual partners before me and that intimate or sexual contacts partly overlapped with the same period in which I was being promised love, fidelity and marriage.</p><p>That timing was decisive for me. The issue was not simply what might have happened at some point before I knew her. It was what contacts and forms of intimacy existed during a period in which I believed we were committing ourselves to a future marriage.</p><h2>Why this matters for marriage</h2><p>For me, sexual history, chastity, fidelity and exclusivity are matters on which both people deserve honest information before marriage. This is not about insulting or degrading someone because of their past. Every adult is responsible for their own life.</p><p>The decisive point is that before engagement I had the right to know the facts that mattered to my personal decision. Only then could I freely decide whether that relationship and marriage were right for me.</p><p>When someone speaks about marriage, fidelity and children while important information about parallel romantic or intimate contacts is missing, the basis of the other person's life decision changes. A genuine yes to marriage requires enough truth to make that choice freely.</p><p>Because the relationship began on a Muslim marriage platform, I also placed particular weight on statements about seriousness, fidelity and marriage. I did not expect perfection, but I did expect honesty about matters that were important in choosing a spouse.</p><div class="quote">What picture will a future husband receive of Yasmine's past – and before making his decision, will he have access to the same complete truth that I needed then?</div><h2>The pattern I experienced</h2><div class="phases"><div class="phase"><strong>Phase 1 – You are very special</strong>Attention, calls, hearts, love, marriage, children and a future.</div><div class="phase"><strong>Phase 2 – Emotional and sexual bonding</strong>Erotic talk, phone sex, meetings, kisses and sex.</div><div class="phase"><strong>Phase 3 – A problem appears</strong>Illness, medication, phone, family or another urgent expense.</div><div class="phase"><strong>Phase 4 – Money and gifts</strong>Financial help becomes linked to care, seriousness or love.</div><div class="phase"><strong>Phase 5 – Coldness</strong>Less time, shorter replies, fewer hearts and distance.</div><div class="phase"><strong>Phase 6 – Warmth returns</strong>Closeness, eroticism, future plans and promises return.</div></div>
<h2>The decisive issue</h2><p>The greatest harm for me is not one payment or one gift. It is losing the ability to make an informed choice. Yasmine could have said: I do not love you. I do not want to marry you. I meet many other men. I have or had parallel relationships. It would have hurt, but I could have decided for myself.</p><div class="quote">Money and sex should not be sold as love.</div>
<h2>An uncomfortable question</h2><p>How can someone really know before marriage whether the picture they have been given of another person's past is accurate? Medical examinations cannot reliably establish a sexual history, and a polygraph cannot provide absolute certainty either.</p><p>Anyone who wants more than trust alone can ultimately only look to <strong>verifiable facts and existing documentation</strong>: earlier messages and chats, timelines, photographs, audio, video, travel or other records, and statements from people who were themselves involved – where that material is lawfully available.</p><p>That is exactly what changed everything for me. Only when I gained access to concrete material from Yasmine's phone and her communication with male contacts could I compare the picture I had previously been given with what was actually documented.</p><div class="quote">Trust matters. But when doubts arise, verifiable facts say more than promises.</div><h2>Original material and another account</h2><p>My documentation includes chats, screenshots, images, audio and video connected with material from Yasmine's phone and her male contacts, as well as conversations with men who showed me their own material and experiences. Some of it is deliberately anonymised so that uninvolved people and private contact information are not unnecessarily exposed.</p><p>I believe the complete context matters. A single sentence or screenshot can be misunderstood, so chronology, repeated wording, images, audio, video and accounts from other participants should be considered together.</p><p>If Yasmine expressly and in writing agrees to publication of specific shared private and intimate communication, I am prepared to disclose it, including my own words, voice and participation. The purpose would not be sexual humiliation, but to allow original material and chronology, in the event of a dispute, to show what was actually said and done.</p><div class="quote">Truth has no reason to fear the complete context.</div><p>If Yasmine gives a different account, nobody should simply believe me blindly. Check the chronology, messages, images, audio, video and context. A response or correction can also be submitted through the report function.</p><h2>Personal attacks do not answer the evidence</h2><p>From my perspective, an important part of Yasmine's response has been to portray me personally as psychologically unstable or as a “psycho”. That shifts attention away from the concrete messages, audio, images, timelines and contacts and toward my personality.</p><p>I cannot know whether this is consciously intended to protect the social image she presents publicly. But if documented material conflicts with that image, labels directed at me do not resolve that conflict.</p><p>For the question of what actually happened, the decisive issue is therefore not what label Yasmine uses for me. What matters are verifiable contents, chronology and available evidence. My own account should be judged by the same standard.</p><h2>Chronology in brief</h2><div class="timeline">More than a year of almost daily contact → long calls and video calls → promises of love and marriage → conversations about children and a future → increasingly intimate calls and phone sex → money and gifts → concrete travel planning with a private apartment, visitors specifically permitted and Yasmine's request for a rental car → meeting in Algiers → kissing and sex → Yasmine wanted an engagement the following day and I agreed → romantic day in Jardin d’Essai du Hamma → serious thoughts about an engagement ring → access to material on Yasmine's phone and her communication with male contacts → chats, screenshots, images, audio and video → conversations with other men and their material → the realisation that I was one of many.</div><h2>What hurt most</h2><p>It was not the money or the gifts. It was the trust. I invested more than a year in the belief that this was about love, engagement, marriage and family. I invested not only feelings, but time, planning, travel, money and an image of a shared life.</p><p>When that picture collapsed, I felt that I had to reassess many conversations, promises and memories. Things that had once seemed romantic suddenly carried a different meaning. Because the relationship had lasted so long and involved so many concrete statements about the future, that reassessment was especially painful.</p><p>I found myself asking which moments had been special only to me and which words might also have been used with other men. That was harder for me to process than any single financial disappointment.</p><p>And yes, I cried because of Yasmine.</p><div class="strong">My loyalty does not make another person loyal. My honesty does not make another person honest. My love cannot force anyone to love me. Love is not a contract that one person can sign alone.</div>`,

caps:["Yasmine sait quel effet elle peut avoir sur les hommes – c’est ainsi que j’ai vécu sa manière de se présenter.","Jardin d’Essai du Hamma, souvent associé aux anciens films de Tarzan. D’après mon expérience, un lieu que Yasmine appréciait pour des rendez-vous romantiques.","Un exemple de notre discussion : son téléphone serait cassé.","Yasmine lors de l’un de ses rendez-vous.","Une autre conversation au sujet d’argent destiné à un nouveau téléphone.","L’une des nombreuses conversations que j’ai vues ensuite : langage romantique et préparation d’une nouvelle rencontre.","Une autre conversation où sont discutés le contact, le lieu de rendez-vous et le déplacement.","Story Instagram avec un chaton sur ses genoux. Pour moi, la mise en scène semblait volontairement séduisante et suggestive – c’est mon interprétation personnelle.","Yasmine avec l’un de ses contacts au Jardin d’Essai du Hamma. J’ai trouvé frappant que le même lieu romantique semble également apparaître avec d’autres contacts.","L’un d’au moins deux comptes Muslima.com que j’ai associés à Yasmine.","Yasmine m’écrit qu’elle aime embrasser à tout moment.","Lorsque je ne l’ai pas contactée pendant quelques jours, elle a réagi de manière très émotionnelle et a exigé une attention quotidienne. J’ai ensuite cru reconnaître des schémas semblables dans d’autres conversations.","Sans commentaire : un message intime de notre conversation qui m’a particulièrement touché.","Une autre conversation intime sur les baisers, la proximité physique et l’idée d’avoir un enfant ensemble."],
story:()=>`<div class="intro">Ceci est mon récit personnel de ce que j’ai vécu, lu, vu et ensuite discuté avec d’autres personnes concernées. Je n’écris pas pour susciter la haine, mais parce que j’aurais voulu disposer plus tôt des informations qui auraient changé mes décisions concernant l’amour, les fiançailles et le mariage.</div>${commonQuran.fr}
<h2>Comment tout a commencé</h2><p>Nous nous sommes connus sur Muslima.com, une plateforme utilisée par de nombreuses personnes recherchant précisément un mariage musulman sérieux. Ce contexte était important pour moi : je ne cherchais pas une aventure passagère, mais une femme avec laquelle un véritable avenir et un mariage pouvaient être possibles.</p><p>Pendant plus d’un an, nous avons été en contact presque chaque jour. Nous écrivions beaucoup, avions de longs appels téléphoniques et des appels vidéo réguliers, parfois jusque tard dans la nuit. Cette continuité sur une longue période a créé chez moi un sentiment de confiance et l’impression d’une vraie relation.</p><p>Au cours de cette longue période de contact, Yasmine m’a également raconté de nombreux éléments personnels sur sa vie. Elle m’a dit qu’elle travaille comme professeure de sport et qu’elle avait auparavant également travaillé comme coach ou entraîneuse dans une salle de fitness. Elle m’a aussi dit qu’elle a un frère et une sœur. Ce sont le type de détails personnels dont nous parlions au cours de nos échanges presque quotidiens.</p><p>Son métier a également contribué à la confiance que je lui accordais à l’époque. À mes yeux, le fait d’être enseignante et entraîneuse donnait une impression de sérieux et de responsabilité. Je ne m’attendais pas, surtout de la part d’une personne exerçant un métier pédagogique, à ce que j’ai découvert plus tard dans les chats, audios, vidéos et autres documents.</p><p>Nous parlions régulièrement d’amour, de mariage, d’enfants et d’un avenir commun. Il y avait des cœurs, des surnoms affectueux, de la tendresse et des phrases que j’ai comprises comme de véritables déclarations d’amour. Je ne pensais plus seulement à une rencontre, mais aux étapes qui pourraient mener à des fiançailles puis au mariage.</p><p>Avec le temps, les échanges sont devenus de plus en plus intimes, avec des conversations érotiques et du sexe au téléphone. L’association entre proximité émotionnelle, promesses de mariage et sexualité renforçait ma conviction que nous avancions vers une relation stable et un mariage.</p><h2>Amour, argent et projets concrets</h2><p>Des sujets financiers revenaient régulièrement : médicaments, téléphone, crèmes, cadeaux et autres dépenses. J’ai envoyé de l’argent et des cadeaux parce que je croyais aider une femme que j’aimais et avec laquelle j’envisageais le mariage. À cette époque, je voyais cette aide comme de la solidarité dans une relation sérieuse.</p><p>Pour mon voyage à Alger, Yasmine m’a demandé de louer un appartement privé et de vérifier expressément à l’avance que les visiteurs y étaient autorisés. Elle m’a expliqué que nous pourrions ainsi nous retrouver plus facilement et passer du temps ensemble au calme, sans être dérangés. Elle souhaitait également que j’organise une voiture de location afin que nous soyons plus indépendants dans nos déplacements.</p><p>L’appartement privé avait donc pour moi une signification particulière : il ne s’agissait pas seulement de dormir quelque part, mais d’avoir un lieu où nous pourrions nous retrouver et être tranquilles ensemble. Avec la demande concernant une voiture de location, cela ressemblait à une préparation très concrète de notre séjour commun.</p><p>J’ai planifié le voyage et l’hébergement en fonction de ce que nous avions discuté. À mes yeux, il ne s’agissait plus de promesses vagues, mais de préparatifs pratiques pour une relation que je croyais orientée vers le mariage.</p><div class="strong">Je ne pensais pas participer à un jeu. Je croyais préparer un futur mariage et j’agissais en conséquence.</div><h2>Alger, intimité et Jardin d’Essai</h2><p>Après plus d’un an, je suis allé à Alger. Pour moi, ce voyage devait faire passer notre longue relation à distance vers la vie réelle dont nous avions si souvent parlé. Lorsque nous nous sommes rencontrés, nous nous sommes pris dans les bras, nous nous sommes embrassés et nous avons eu des relations sexuelles.</p><p>En tant que musulman, je ne considérais pas cela comme quelque chose de banal. Pour moi, la sexualité appartient normalement au mariage. Avec les promesses répétées de mariage, cette intimité avait donc une signification très sérieuse.</p><p>Yasmine voulait que nous nous fiancions dès le lendemain. J’étais d’accord. Avant cela, je lui avais déjà demandé quel type de bague de fiançailles elle aimait et quelle était sa taille de bague. Elle savait donc que je préparais une demande et elle était d’accord avec les fiançailles. Pour moi, cela correspondait à tout ce qui avait été dit auparavant sur l’amour, le mariage et l’avenir et renforçait mon impression que la relation était réellement sérieuse.</p><p>Le lendemain, nous sommes allés au Jardin d’Essai du Hamma. À ce moment-là, je pensais que c’était notre lieu romantique particulier. Je réfléchissais déjà concrètement à une bague de fiançailles ; je me souviens que la taille se terminait par 8 et je crois qu’il s’agissait de 48, même si je ne suis plus totalement certain de ce chiffre.</p><p>Mais avant que la demande prévue puisse avoir lieu, on m’a envoyé de nombreux contenus provenant du téléphone de Yasmine et de ses communications avec des contacts masculins, notamment des chats, captures d’écran, images, audios et vidéos. Ce que j’ai vu et entendu a complètement changé la situation pour moi. Un jour avant la demande prévue, j’ai donc décidé de modifier mon vol retour et de quitter Alger plus tôt.</p><p>Je possède la confirmation de cette modification de vol et je pourrai prochainement la montrer sous une forme anonymisée comme élément chronologique. Elle documente que j’ai interrompu mon voyage juste avant la demande prévue.</p><p>Yasmine s’est mise très en colère parce que je suis parti plus tôt et que je ne lui ai finalement pas fait ma demande. Pour moi, cette chronologie est importante : jusqu’à la réception de ces contenus, je préparais encore les fiançailles. Ce sont les éléments qui m’ont été envoyés qui ont changé ma décision.</p><h2>Ce que j’ai découvert ensuite</h2><p>Plus tard, j’ai eu accès à des contenus présents sur le téléphone de Yasmine, en particulier à sa communication avec des contacts masculins. Il s’agissait de chats, captures d’écran, images, audios et vidéos. J’ai également parlé avec d’autres hommes qui m’ont montré ou décrit leurs propres messages, photos et expériences. Plus je voyais de documents, plus ma compréhension de la relation changeait.</p><p>Pour moi, il était important qu’il ne s’agisse pas simplement de rumeurs ou d’affirmations générales sur les réseaux sociaux. Il s’agissait de contenus provenant du téléphone de Yasmine et de ses communications directes avec des hommes. Une grande partie de ce que j’ai vu ne correspondait pas à l’image d’exclusivité, d’amour et de mariage que j’avais jusque-là.</p><p>Selon ma propre analyse, il y avait parfois environ 50 contacts masculins en parallèle et, sur une période plus longue, des centaines de contacts se sont accumulés. Ce nombre correspond à mon évaluation des éléments et ne signifie pas que chaque contact avait la même importance.</p><div class="strong">Pour moi, la conclusion douloureuse était claire : j’étais l’un parmi beaucoup d’autres.</div><p>De nombreux contacts ne semblaient même pas enregistrés sous de vrais noms. Des surnoms génériques revenaient souvent. Même mon propre prénom a été écrit incorrectement une fois après une longue période de contact.</p><p>D’autres hommes m’ont parlé de rencontres, de communication romantique et de contacts intimes ou sexuels. Certains m’ont montré leurs propres messages ou images. Le Jardin d’Essai du Hamma est également réapparu, ce qui m’a particulièrement touché parce que je l’avais considéré comme un lieu spécial entre nous.</p><p>À partir des messages, des images et de mes discussions avec d’autres hommes, j’ai conclu que Yasmine avait déjà eu d’autres partenaires sexuels avant moi et que des contacts intimes ou sexuels avaient en partie eu lieu pendant la même période où elle me promettait amour, fidélité et mariage.</p><p>Ce chevauchement temporel était essentiel pour moi. Il ne s’agissait pas seulement de savoir ce qui avait pu se passer avant que je la connaisse, mais de comprendre quels contacts existaient pendant une période où je croyais que nous nous engagions l’un envers l’autre en vue du mariage.</p><h2>Pourquoi cela compte avant le mariage</h2><p>Pour moi, le passé sexuel, la chasteté, la fidélité et l’exclusivité sont des sujets sur lesquels les deux personnes doivent pouvoir disposer d’informations honnêtes avant le mariage. Il ne s’agit pas d’insulter ou de rabaisser quelqu’un pour son passé.</p><p>Le point essentiel est que, avant des fiançailles, j’avais le droit de connaître les faits importants pour ma décision personnelle. Ce n’est qu’ainsi que j’aurais pu décider librement si cette relation et ce mariage me convenaient.</p><p>Lorsqu’une personne parle de mariage, de fidélité et d’enfants alors que des informations importantes sur des contacts romantiques ou intimes parallèles manquent, la base de la décision de l’autre personne change. Dire oui à un mariage suppose de disposer des vérités importantes pour ce choix.</p><p>Parce que notre relation avait commencé sur une plateforme musulmane de mariage, j’accordais aussi un poids particulier aux paroles sur la fidélité, le sérieux et le mariage. Je n’attendais pas la perfection, mais j’attendais de l’honnêteté sur des questions importantes pour le choix d’un conjoint.</p><div class="quote">Quelle image un futur mari recevra-t-il du passé de Yasmine – et aura-t-il, avant de décider, accès à la même vérité complète dont j’aurais eu besoin ?</div><h2>Le schéma que j’ai vécu</h2><div class="phases"><div class="phase"><strong>Phase 1 – Tu es quelqu’un de très spécial</strong>Attention, appels, cœurs, amour, mariage, enfants et avenir.</div><div class="phase"><strong>Phase 2 – Lien émotionnel et sexuel</strong>Érotisme, sexe au téléphone, rencontres, baisers et sexe.</div><div class="phase"><strong>Phase 3 – Un problème apparaît</strong>Maladie, médicaments, téléphone, famille ou dépense urgente.</div><div class="phase"><strong>Phase 4 – Argent et cadeaux</strong>L’aide financière devient liée à l’affection ou à l’amour.</div><div class="phase"><strong>Phase 5 – Froideur</strong>Moins de temps, réponses plus courtes, distance.</div><div class="phase"><strong>Phase 6 – Retour de la chaleur</strong>Proximité, érotisme, avenir et promesses reviennent.</div></div>
<h2>Le point décisif</h2><p>Pour moi, le plus grand dommage n’est pas un paiement ou un cadeau. C’est la perte d’un choix éclairé. Yasmine aurait pu dire qu’elle ne m’aimait pas, qu’elle ne voulait pas m’épouser ou qu’elle avait d’autres relations. Cela aurait fait mal, mais j’aurais pu décider moi-même.</p><div class="quote">L’argent et le sexe ne doivent pas être vendus comme de l’amour.</div>
<h2>Une question inconfortable</h2><p>Comment peut-on réellement savoir avant un mariage si l'image que l'on nous présente du passé d'une personne correspond à la réalité ? Un examen médical ne permet pas d'établir de manière fiable l'histoire sexuelle d'une personne, et un test au polygraphe n'apporte pas non plus de certitude absolue.</p><p>Celui qui souhaite aller au-delà de la seule confiance ne peut finalement s'appuyer que sur des <strong>faits vérifiables et des documents existants</strong> : anciens messages et conversations, chronologie, photos, audios, vidéos, documents de voyage ou autres éléments, ainsi que les déclarations de personnes directement impliquées – lorsque ces éléments sont disponibles légalement.</p><p>C'est précisément ce qui a tout changé pour moi. Ce n'est qu'après avoir eu accès à des contenus concrets provenant du téléphone de Yasmine et à ses communications avec des contacts masculins que j'ai pu comparer l'image qui m'avait été présentée avec ce qui était réellement documenté.</p><div class="quote">La confiance est importante. Mais lorsque des doutes apparaissent, les faits vérifiables en disent plus que les promesses.</div><h2>Documents originaux et autre version</h2><p>Ma documentation comprend des chats, captures d’écran, images, audios et vidéos liés aux contenus du téléphone de Yasmine et à ses contacts masculins, ainsi que des conversations avec des hommes qui m’ont montré leurs propres éléments et expériences. Une partie est volontairement anonymisée afin de ne pas exposer inutilement des tiers ou leurs coordonnées privées.</p><p>Je considère que le contexte complet est important. Une phrase ou une capture isolée peut être mal comprise ; la chronologie, les formulations répétées, les images, les audios, les vidéos et les récits des autres personnes concernées doivent être considérés ensemble.</p><p>Si Yasmine accepte expressément et par écrit la publication précise de notre communication privée et intime, je suis prêt à la montrer, y compris mes propres paroles, ma voix et ma participation. L’objectif ne serait pas l’humiliation sexuelle, mais de permettre aux originaux et à la chronologie de montrer, en cas de contestation, ce qui a réellement été dit et fait.</p><div class="quote">La vérité n’a pas à craindre le contexte complet.</div><p>Si Yasmine raconte une autre version, personne ne doit simplement me croire aveuglément. Il faut vérifier la chronologie, les messages, les images, les audios, les vidéos et leur contexte. Une réponse ou une correction peut également être envoyée par la fonction de signalement.</p><h2>Les attaques personnelles ne répondent pas aux preuves</h2><p>De mon point de vue, une partie importante de la réaction de Yasmine consiste à me présenter personnellement comme psychologiquement instable ou comme un « psycho ». Cela déplace la discussion des messages, audios, images, chronologies et contacts concrets vers ma personne.</p><p>Je ne peux pas savoir si cela vise consciemment à protéger l’image sociale qu’elle présente à l’extérieur. Mais si des éléments documentés sont en contradiction avec cette image, les étiquettes dirigées contre moi ne résolvent pas cette contradiction.</p><p>Pour savoir ce qui s’est réellement passé, le point décisif n’est donc pas le qualificatif que Yasmine utilise à mon sujet. Ce qui compte, ce sont les contenus vérifiables, la chronologie et les preuves disponibles. Mon propre récit doit être évalué selon le même critère.</p><h2>Chronologie résumée</h2><div class="timeline">Plus d’un an de contact presque quotidien → longs appels et appels vidéo → promesses d’amour et de mariage → discussions sur les enfants et l’avenir → appels de plus en plus intimes et sexe au téléphone → argent et cadeaux → préparation concrète du voyage avec appartement privé, visiteurs expressément autorisés et souhait de Yasmine qu’une voiture de location soit organisée → rencontre à Alger → baisers et sexe → Yasmine voulait des fiançailles dès le lendemain et j’étais d’accord → journée romantique au Jardin d’Essai du Hamma → réflexion concrète sur une bague de fiançailles → accès à des contenus du téléphone de Yasmine et à ses communications avec des contacts masculins → chats, captures, images, audios et vidéos → discussions avec d’autres hommes et leurs documents → prise de conscience que j’étais l’un parmi beaucoup d’autres.</div><h2>Ce qui m’a le plus blessé</h2><p>Ce n’était ni l’argent ni les cadeaux. C’était la confiance. J’ai investi plus d’un an dans l’idée d’un amour, de fiançailles, d’un mariage et d’une famille. Je n’avais pas investi seulement mes sentiments, mais aussi du temps, de l’organisation, un voyage, de l’argent et l’image d’une vie commune.</p><p>Quand cette image s’est effondrée, j’ai eu le sentiment de devoir réévaluer après coup de nombreuses conversations, promesses et souvenirs. Des choses qui m’avaient semblé romantiques prenaient soudain une autre signification. Le fait que la relation ait duré aussi longtemps a rendu cette réévaluation particulièrement douloureuse.</p><p>Je me suis demandé quels moments avaient été spéciaux uniquement pour moi et quels mots avaient peut-être également été adressés à d’autres hommes. Cela a été plus difficile à accepter pour moi qu’une seule perte financière.</p><p>Et oui, j’ai pleuré à cause de Yasmine.</p><div class="strong">Ma loyauté ne rend pas une autre personne loyale. Mon honnêteté ne rend pas une autre personne honnête. Mon amour ne peut obliger personne à m’aimer. L’amour n’est pas un contrat qu’une seule personne peut signer.</div>`,

forumTitle:"شارك تجربتك",forumText:"يمكن لمن يرغب في سرد تجربته استخدام المنتدى الخارجي بالعربية أو الفرنسية أو القبائلية أو الإنجليزية أو الألمانية.",forumBtn:"الدخول إلى منتدى التجارب",commentsTitle:"التعليقات",commentsHelp:"يمكن للزوار التعليق هنا من دون إنشاء حساب. وقد تخضع التعليقات للمراجعة قبل النشر. يُرجى عدم نشر بيانات اتصال خاصة بأشخاص آخرين.",legalTitle:"ملاحظات حول الصور والخصوصية والتبليغ",closing:"لو قالت لي ياسمين الحقيقة كاملة منذ البداية، ربما كانت ستخسر حبي، لكنها كانت ستحتفظ باحترامي.",footer:"رواية تجربة شخصية · 2026",reportBtn:"⚑ الإبلاغ عن محتوى",reportTitle:"الإبلاغ عن محتوى",reportHelp:"يرجى تحديد الصورة أو الفقرة المقصودة بدقة.",name:"الاسم (اختياري)",email:"البريد الإلكتروني",reason:"السبب",message:"الرسالة",send:"إرسال البلاغ",reasons:["يرجى الاختيار","الخصوصية / صورة","معلومة خاطئة أو مضللة","روايتي / حقي في الرد","سبب آخر"],
caps:["ياسمين تعرف التأثير الذي يمكن أن تتركه على الرجال – هكذا عشت طريقة تقديمها لنفسها.","حديقة التجارب بالحامة، المرتبطة لدى كثيرين بأفلام طرزان القديمة. بحسب تجربتي، كانت ياسمين تحب هذا المكان للقاءات الرومانسية.","مثال من محادثتنا: هاتفها كان، بحسب ما قيل لي، معطلاً.","ياسمين في أحد لقاءاتها.","محادثة أخرى حول جمع المال لشراء هاتف جديد.","واحدة من محادثات كثيرة رأيتها لاحقاً: كلام رومانسي وترتيب لقاء آخر.","محادثة أخرى يجري فيها الحديث عن الاتصال ومكان اللقاء وطريقة الوصول.","قصة على إنستغرام مع قطة صغيرة على حجرها. بالنسبة لي بدا العرض مقصوداً ليكون جذاباً وذا إيحاء – وهذا تفسيري الشخصي.","ياسمين مع أحد معارفها في حديقة التجارب بالحامة. لفت انتباهي أن المكان الرومانسي نفسه بدا حاضراً أيضاً مع معارف آخرين.","أحد حسابين على الأقل في Muslima.com ربطتهما بياسمين.","ياسمين تكتب لي أنها تحب التقبيل في أي وقت.","عندما لم أتواصل معها عدة أيام، ردت بعاطفة شديدة وطالبت باهتمام يومي. لاحقاً شعرت أنني رأيت أنماطاً مشابهة في محادثات أخرى.","بلا تعليق: رسالة حميمة من محادثتنا أثرت فيّ كثيراً.","محادثة حميمة أخرى عن التقبيل والقرب الجسدي وفكرة إنجاب طفل معاً."],
story:()=>`<div class="intro">هذه روايتي الشخصية لما عشته وقرأته ورأيته ثم ناقشته لاحقاً مع أشخاص آخرين معنيين. لا أكتب من أجل نشر الكراهية، بل لأنني كنت أتمنى لو عرفت في وقت أبكر المعلومات التي كانت ستغيّر قراري بشأن الحب والخطوبة والزواج.</div>${commonQuran.ar}
<h2>كيف بدأت القصة</h2><p>تعرفنا عبر Muslima.com، وهو موقع يستخدمه كثير من الناس تحديداً للبحث عن زواج مسلم جاد. هذا الإطار كان مهماً بالنسبة لي، لأنني لم أكن أبحث عن تعارف عابر أو قصة قصيرة على الإنترنت، بل عن امرأة يمكن أن يكون معها مستقبل حقيقي وزواج.</p><p>لأكثر من سنة كنا نتواصل تقريباً كل يوم. كتبنا كثيراً، وأجرينا مكالمات طويلة ومكالمات فيديو منتظمة، وأحياناً حتى وقت متأخر من الليل. هذه الاستمرارية الطويلة هي التي جعلت الثقة تكبر عندي وجعلت العلاقة تبدو حقيقية وليست مجرد تواصل متقطع.</p><p>وخلال هذه الفترة الطويلة من التواصل أخبرتني ياسمين أيضاً بتفاصيل شخصية كثيرة عن حياتها. قالت لي إنها تعمل مدرسةً للرياضة، وإنها عملت من قبل أيضاً كمدربة أو «كوتش» في مركز للياقة البدنية. كما قالت لي إن لديها أخاً واحداً وأختاً واحدة. وكانت مثل هذه التفاصيل الشخصية من بين الأمور الكثيرة التي تحدثنا عنها خلال تواصلنا شبه اليومي.</p><p>كما أن عملها ساهم وقتها في زيادة ثقتي بها. بالنسبة لي كانت وظيفة المعلمة والمدربة توحي بالجدية وتحمل المسؤولية. ولم أكن أتوقع، خصوصاً من شخص يعمل في مجال تربوي، ما رأيته وسمعته لاحقاً في المحادثات والتسجيلات الصوتية والفيديوهات وغيرها من المواد.</p><p>كان الحديث يتكرر عن الحب والزواج والأطفال والمستقبل المشترك. كانت هناك قلوب وأسماء تدليل وكلام حنون وعبارات فهمتها على أنها تصريحات حب واضحة. لم أعد أفكر فقط في لقاء، بل في الخطوات التي يمكن أن تقود إلى خطوبة ثم زواج.</p><p>ومع الوقت أصبح التواصل أكثر حميمية، بما في ذلك محادثات ذات طابع جنسي وعلاقة جنسية عبر الهاتف. اجتماع القرب العاطفي ووعود الزواج والحميمية جعلني أعتقد أكثر أننا نتجه إلى علاقة ثابتة وزواج.</p><h2>الحب والمال وخطط المستقبل</h2><p>ظهرت مراراً مواضيع مالية: دواء، هاتف، كريمات، هدايا ومصاريف أخرى. أرسلت المال والهدايا لأنني كنت أعتقد أنني أساعد امرأة أحبها وأفكر في الزواج منها. في ذلك الوقت كنت أرى هذه المساعدة كجزء من الاهتمام داخل علاقة جدية.</p><p>قبل رحلتي إلى الجزائر العاصمة طلبت مني ياسمين استئجار شقة خاصة والتأكد بشكل صريح مسبقاً من السماح بدخول الزوار. شرحت لي أن ذلك سيسمح لنا بالالتقاء بسهولة أكبر وقضاء وقت معاً بهدوء ومن دون إزعاج. كما طلبت أن أنظم سيارة مستأجرة حتى نكون أكثر استقلالاً وأسهل في التنقل.</p><p>لذلك لم تكن الشقة الخاصة بالنسبة لي مجرد مكان للنوم. الهدف كان أن يكون لدينا مكان نستطيع أن نلتقي فيه ونقضي وقتاً خاصاً وهادئاً معاً. ومع طلب سيارة مستأجرة بدا الأمر لي كتحضير عملي ومحدد لإقامتنا المشتركة.</p><p>خططت للسفر والسكن بناءً على ما اتفقنا عليه. بالنسبة لي لم تعد هذه مجرد وعود عامة عن المستقبل، بل خطوات فعلية لعلاقة كنت أعتقد أنها تتجه إلى الزواج.</p><div class="strong">لم أعتقد أنني داخل لعبة. كنت أعتقد أنني أستعد لزواج مستقبلي وتصرفت على هذا الأساس.</div><h2>الجزائر العاصمة والقرب</h2><p>بعد أكثر من عام سافرت إلى الجزائر العاصمة. بالنسبة لي كانت الرحلة انتقالاً من علاقة طويلة عن بعد إلى الحياة الحقيقية التي تحدثنا عنها كثيراً. عندما التقينا تعانقنا وتبادلنا القبل ومارسنا الجنس.</p><p>كشخص مسلم، لم أعتبر ذلك أمراً عابراً. الجنس بالنسبة لي مكانه الطبيعي داخل الزواج. ولهذا، ومع استمرار وعود الزواج، فهمت هذه العلاقة الحميمة على أنها أمر شديد الجدية وجزء من المستقبل الذي كنت أعتقد أننا نبنيه.</p><p>كانت ياسمين تريد أن تتم خطوبتنا في اليوم التالي مباشرة، وكنت موافقاً على ذلك. وقبل ذلك كنت قد سألتها عن نوع خاتم الخطوبة الذي تحبه وعن مقاس خاتمها. لذلك كانت تعرف أنني أخطط لطلب خطوبتها وكانت موافقة على الخطوبة. بالنسبة لي كان هذا ينسجم مع كل ما قيل من قبل عن الحب والزواج والمستقبل، ويؤكد أن العلاقة جدية.</p><p>في اليوم التالي ذهبنا إلى حديقة التجارب بالحامة. في ذلك الوقت كنت أظن أنها مكاننا الرومانسي الخاص. وكنت أفكر فعلاً في خاتم خطوبة؛ أتذكر أن المقاس كان ينتهي بالرقم 8 وأظن أنه كان 48، لكنني لم أعد متأكداً مئة بالمئة من هذا الرقم وحده.</p><p>لكن قبل أن يتم طلب الخطوبة الذي كنت أخطط له، أُرسلت إليّ مواد كثيرة من هاتف ياسمين ومن تواصلها مع رجال، بما في ذلك محادثات ولقطات شاشة وصور وتسجيلات صوتية وفيديوهات. ما رأيته وسمعته غيّر الموقف بالنسبة لي بالكامل. وقبل يوم واحد من طلب الخطوبة المخطط له قررت تغيير حجز رحلة العودة ومغادرة الجزائر العاصمة مبكراً.</p><p>توجد لديّ وثيقة تأكيد تغيير حجز الرحلة، ويمكنني قريباً عرضها بعد إخفاء البيانات الخاصة باعتبارها دليلاً زمنياً. وهي توثق أنني قطعت الرحلة قبل موعد طلب الخطوبة مباشرة.</p><p>غضبت ياسمين بشدة لأنني غادرت مبكراً ولم أقدم لها طلب الخطوبة. وهذا التسلسل مهم بالنسبة لي: حتى اللحظة التي وصلتني فيها تلك المواد كنت أخطط للخطوبة. المواد التي أُرسلت إليّ هي التي جعلتني أغيّر قراري.</p><h2>ما اكتشفته لاحقاً</h2><p>لاحقاً اطلعت على محتويات في هاتف ياسمين، وبشكل خاص على تواصلها مع رجال. شملت هذه المحتويات محادثات ولقطات شاشة وصوراً وتسجيلات صوتية وفيديوهات. كما تحدثت مع رجال آخرين أظهروا لي أو وصفوا لي رسائلهم وصورهم وتجاربهم. وكلما رأيت مواد أكثر، تغير فهمي للعلاقة أكثر.</p><p>كان مهماً بالنسبة لي أن الأمر لم يكن مجرد شائعات أو كلام عام في وسائل التواصل. كان يتعلق بمحتويات من هاتف ياسمين وباتصالاتها المباشرة مع رجال. كثير مما رأيته لم يكن ينسجم مع الصورة التي كنت أؤمن بها عن الحصرية والحب والزواج.</p><p>بحسب تقييمي للمواد، كان هناك في بعض الفترات قرابة 50 اتصالاً مع رجال في الوقت نفسه، وعلى مدى أطول تراكمت مئات الاتصالات. هذه الأرقام تعبّر عن تقييمي للمواد ولا تعني أن كل اتصال كان له المعنى نفسه.</p><div class="strong">بالنسبة لي كانت النتيجة المؤلمة واضحة: كنت واحداً من كثيرين.</div><p>بعض الاتصالات لم يكن محفوظاً حتى بأسماء واضحة، وتكررت أسماء تدليل عامة. وحتى اسمي أنا كُتب مرة بشكل خاطئ بعد فترة طويلة.</p><p>رجال آخرون تحدثوا معي عن لقاءات وكلام رومانسي واتصالات حميمة أو جنسية. بعضهم أظهر لي رسائله أو صوره. وظهر اسم حديقة التجارب بالحامة أيضاً، وكان ذلك مؤلماً بالنسبة لي لأنني كنت أعتقد أن هذا المكان شيء خاص بيننا.</p><p>ومن خلال الرسائل والصور ومحادثاتي مع رجال آخرين خلصت إلى أن ياسمين كان لها شركاء جنسيون آخرون قبلي، وأن اتصالات حميمة أو جنسية وقعت جزئياً خلال الفترة نفسها التي كانت تعدني فيها بالحب والوفاء والزواج.</p><p>هذا التداخل الزمني كان مهماً جداً بالنسبة لي. القضية لم تكن فقط ما الذي حدث في وقت سابق قبل معرفتي بها، بل ما نوع الاتصالات التي كانت موجودة خلال فترة كنت أعتقد فيها أننا نلتزم ببناء زواج مشترك.</p><h2>لماذا هذا مهم قبل الزواج</h2><p>بالنسبة لي، الماضي الجنسي والعفة والوفاء والحصرية أمور يحق للطرفين أن يعرفا حقيقتها قبل الزواج. لا يتعلق الأمر بإهانة إنسان أو التقليل من قيمته بسبب ماضيه.</p><p>النقطة الحاسمة هي أنه كان من حقي قبل الخطوبة أن أعرف الحقائق المهمة لقراري الشخصي. فقط عندها كان يمكنني أن أقرر بحرية إن كانت هذه العلاقة وهذا الزواج مناسبين لي.</p><p>عندما يتحدث شخص عن الزواج والوفاء والأطفال بينما تغيب معلومات مهمة عن علاقات أو اتصالات رومانسية أو حميمة متوازية، فإن أساس قرار الطرف الآخر يتغير. الموافقة الحقيقية على الزواج تحتاج إلى معرفة الحقائق المهمة لهذا الاختيار.</p><p>ولأن علاقتنا بدأت على موقع مسلم للزواج، أعطيت أيضاً وزناً خاصاً للكلام عن الجدية والوفاء والزواج. لم أكن أطلب الكمال، بل الصراحة في الأمور التي تؤثر في اختيار شريك الحياة.</p><div class="quote">أي صورة سيحصل عليها زوج ياسمين المستقبلي عن ماضيها؟ وهل ستتاح له قبل قراره الحقيقة الكاملة نفسها التي كنت أحتاجها أنا؟</div><h2>النمط الذي عشته</h2><div class="phases"><div class="phase"><strong>المرحلة 1 – أنت شخص مميز جداً</strong>اهتمام، مكالمات، قلوب، حب، زواج، أطفال ومستقبل.</div><div class="phase"><strong>المرحلة 2 – ارتباط عاطفي وجنسي</strong>حديث جنسي، علاقة عبر الهاتف، لقاءات، قبل وجنس.</div><div class="phase"><strong>المرحلة 3 – ظهور مشكلة</strong>مرض، دواء، هاتف، عائلة أو مصروف عاجل.</div><div class="phase"><strong>المرحلة 4 – المال والهدايا</strong>المساعدة المالية ترتبط بالاهتمام أو الحب.</div><div class="phase"><strong>المرحلة 5 – البرود</strong>وقت أقل وردود أقصر ومسافة أكبر.</div><div class="phase"><strong>المرحلة 6 – عودة الدفء</strong>عودة القرب والإثارة والحديث عن المستقبل.</div></div>
<h2>المشكلة الأساسية</h2><p>أكبر ضرر بالنسبة لي ليس دفعة مالية ولا هدية، بل ضياع القرار المبني على معرفة كاملة. كان يمكن لياسمين أن تقول إنها لا تحبني أو لا تريد الزواج مني أو أن لديها علاقات أخرى. كان ذلك سيؤلمني، لكنه كان سيتركني أقرر بنفسي.</p><div class="quote">لا ينبغي بيع المال والجنس على أنهما حب.</div>
<h2>سؤال غير مريح</h2><p>كيف يمكن لشخص قبل الزواج أن يعرف فعلاً ما إذا كانت الصورة التي قُدمت له عن ماضي الطرف الآخر صحيحة؟ الفحوص الطبية لا تستطيع إثبات التاريخ الجنسي بشكل موثوق، كما أن اختبار كشف الكذب لا يمنح يقيناً مطلقاً.</p><p>ومن يريد أكثر من مجرد الثقة لا يبقى أمامه في النهاية إلا الاعتماد على <strong>وقائع قابلة للتحقق ووثائق موجودة</strong>: رسائل ومحادثات سابقة، تسلسل زمني، صور، تسجيلات صوتية، فيديوهات، وثائق سفر أو أدلة أخرى، وكذلك أقوال أشخاص كانوا هم أنفسهم أطرافاً في الأحداث – متى كانت هذه المواد متاحة بصورة قانونية.</p><p>وهذا بالضبط ما غيّر كل شيء بالنسبة لي. فقط عندما حصلت على محتويات محددة من هاتف ياسمين وعلى اتصالاتها مع رجال، استطعت أن أقارن الصورة التي كانت قد قُدمت لي بما كان موثقاً فعلاً.</p><div class="quote">الثقة مهمة. لكن عندما تظهر الشكوك، تقول الوقائع القابلة للتحقق أكثر مما تقوله الوعود.</div><h2>المواد الأصلية والرواية الأخرى</h2><p>توثيقي يشمل محادثات ولقطات شاشة وصوراً وتسجيلات صوتية وفيديوهات مرتبطة بمحتويات هاتف ياسمين واتصالاتها مع رجال، إضافة إلى محادثات مع رجال أظهروا لي موادهم وتجاربهم. وقد تم إخفاء جزء من هذه المواد عمداً حتى لا تُكشف بيانات أشخاص غير معنيين أو معلومات اتصال خاصة بلا ضرورة.</p><p>أعتبر السياق الكامل مهماً. يمكن أن تُفهم جملة واحدة أو لقطة واحدة بشكل خاطئ، ولذلك يجب النظر إلى التسلسل الزمني والعبارات المتكررة والصور والتسجيلات والفيديوهات وروايات الآخرين معاً.</p><p>إذا وافقت ياسمين بشكل صريح وخطي على نشر جزء محدد من تواصلنا الخاص والحميم، فأنا مستعد لكشفه بما في ذلك كلماتي وصوتي ومشاركتي. الهدف ليس الإذلال الجنسي، بل أن تسمح المواد الأصلية والتسلسل الزمني، عند وجود خلاف، بإظهار ما قيل وما فُعل فعلاً.</p><div class="quote">الحقيقة لا تخاف من السياق الكامل.</div><p>إذا قدمت ياسمين رواية مختلفة، فلا أطلب من أحد أن يصدقني بصورة عمياء. افحصوا التسلسل الزمني والرسائل والصور والتسجيلات والفيديوهات والسياق. ويمكن أيضاً إرسال رد أو تصحيح عبر وظيفة الإبلاغ.</p><h2>الهجمات الشخصية لا تجيب عن الأدلة</h2><p>من وجهة نظري، يتمثل جزء مهم من رد ياسمين في وصفي شخصياً بأنني غير مستقر نفسياً أو «مجنون». وهذا ينقل النقاش بعيداً عن الرسائل والتسجيلات والصور والتسلسل الزمني والاتصالات الملموسة إلى شخصي أنا.</p><p>لا أستطيع أن أعرف إن كان ذلك يحدث عن قصد لحماية الصورة الاجتماعية التي تقدمها للآخرين. لكن إذا كانت المواد الموثقة تتعارض مع تلك الصورة، فإن إطلاق أوصاف شخصية عليّ لا يحل هذا التعارض.</p><p>لذلك، عند السؤال عما حدث فعلاً، ليس المهم الوصف الذي تستخدمه ياسمين عني. المهم هو المحتوى القابل للتحقق والتسلسل الزمني والأدلة الموجودة. ويجب أيضاً تقييم روايتي أنا بالمعيار نفسه.</p><h2>التسلسل باختصار</h2><div class="timeline">أكثر من سنة من التواصل شبه اليومي → مكالمات طويلة ومكالمات فيديو → وعود بالحب والزواج → حديث عن الأطفال والمستقبل → مكالمات أكثر حميمية وعلاقة جنسية عبر الهاتف → مال وهدايا → تخطيط للسفر مع شقة خاصة والسماح الصريح بالزوار وطلب ياسمين تنظيم سيارة مستأجرة → لقاء في الجزائر العاصمة → قبل وجنس → ياسمين أرادت الخطوبة في اليوم التالي وكنت موافقاً → يوم رومانسي في حديقة التجارب بالحامة → تفكير جدي في خاتم خطوبة → الاطلاع على محتويات هاتف ياسمين واتصالاتها مع رجال → محادثات ولقطات وصور وصوت وفيديو → حديث مع رجال آخرين وموادهم → إدراكي أنني كنت واحداً من كثيرين.</div><h2>ما آذاني أكثر</h2><p>لم يكن المال ولا الهدايا. كانت الثقة. استثمرت أكثر من عام وأنا أؤمن بالحب والخطوبة والزواج والأسرة. لم أستثمر مشاعري فقط، بل الوقت والتنظيم والسفر والمال وصورة لحياة مشتركة.</p><p>عندما انهارت هذه الصورة شعرت أن علي إعادة تقييم كثير من المحادثات والوعود والذكريات. أشياء كانت تبدو لي رومانسية في السابق أصبح لها فجأة معنى مختلف. طول العلاقة وكثرة الكلام المحدد عن المستقبل جعلا هذه المراجعة مؤلمة بشكل خاص.</p><p>بدأت أسأل نفسي أي اللحظات كانت خاصة بالنسبة لي وحدي، وأي الكلمات ربما قيلت أيضاً لرجال آخرين. كان ذلك أصعب بالنسبة لي من أي خسارة مالية منفردة.</p><p>ونعم، بكيت بسبب ياسمين.</p><div class="strong">وفائي لا يجعل شخصاً آخر وفياً. صدقي لا يجعل شخصاً آخر صادقاً. حبي لا يجبر أحداً على أن يحبني. الحب ليس عقداً يستطيع شخص واحد توقيعه بمفرده.</div>`,

caps:["Yasmine teẓra amek ara d-tban i yirgazen – akka i lliɣ tt-waliɣ deg uskan-is.","Jardin d’Essai du Hamma, amkan i d-ttemmeslayen ɣef Tarzan. Deg termit-iw, d amkan i tḥemmel i yimlilen iḥulfanen.","Amedya seg chat-nneɣ: tilifun-is, akka i d-tenna, yerreẓ.","Yasmine deg yiwen seg yimlilen-is.","Chat nniḍen ɣef ujemmeɛ n yidrimen i tilifun amaynut.","Yiwen seg chats i waliɣ later: awal aḥulfan d useggem n yimlil nniḍen.","Chat nniḍen anda i d-ttmeslayen ɣef contact, amkan n yimlil d abrid.","Story n Instagram s umcic ameẓyan ɣef yiɣil-is. Nek waliɣ-as talɣa i d-yettawin lwelha – d tamuɣli-iw kan.","Yasmine d yiwen seg contacts-is deg Jardin d’Essai du Hamma. Isteqsa-yi mi waliɣ amkan-a yella daɣen deg yimlilen nniḍen.","Yiwen seg sin accounts n Muslima.com i qqneɣ ɣer Yasmine.","Yasmine taru-yi belli tḥemmel leqbel yal tikelt.","Mi ur as-d-mmeslayeɣ ara kra n wussan, terra s waṭas n lḥess d usuter n lwelha yal ass. Later, waliɣ amecwar am wagi deg chats nniḍen.","War awal: izen uslig seg chat-nneɣ i yi-yeḥzen aṭas.","Chat uslig nniḍen ɣef leqbel, lqرب d tikti n tarwa s tayri."],
story:()=>`<div class="intro">Wagi d wayen i ḥḍreɣ nek: ayen i ɣriɣ, i waliɣ d wayen i d-nniɣ d yimdanen nniḍen. Ur ttaruɣ ara akken ad d-awiɣ lkarh; ttaruɣ acku lemmer ssneɣ aya zik, tikti-iw ɣef tayri, xtuba d zwaj tili tesɛa talɣa nniḍen.</div>${commonQuran.kab}
<h2>Amek i tebda</h2><p>Nemlal deg Muslima.com, anda aṭas n yimdanen ttnaḍin ɣef zwaj muslim s جد. Aya yesɛa azal ɣur-i, acku ur lliɣ ara ttnaḍiɣ ɣef contact n wass kan, maca ɣef tamettut yid-s ara yezmer ad yili yimal d zwaj.</p><p>Ugar n yiwen useggas, qrib yal ass, nettmeslay s messages, s tilifun d video. Tikwal imeslayen ttkemmilen armi d yiḍ. Taqrabt-a iṭulen d yiwen useggas tefka-yi laman ugar, u ḥesbeɣ relation-a d حاجة n tidet mačči contact n internet kan.</p><p>Deg wakud-a iṭulen n contact, Yasmine teḥka-yi daɣen aṭas n tlufa tusligin ɣef tudert-is. Tenna-yi belli txeddem d taselmad n sport, u uqbel txeddem daɣen d coach neɣ trainer deg fitness centre. Tenna-yi daɣen belli ɣur-s yiwen n gma-s d yiwet n weltma-s. Talɣa-a n yisalan tusligen tella seg wayen aṭas i nettmeslay qrib yal ass.</p><p>Axeddim-is yerna-yi laman deg wakud-nni. I nek, axeddim d taselmad d trainer yefka-d tugna n serious d responsibility. Ur lliɣ ara ttṛajuɣ, ladɣa seg yiwen i ixeddmen deg field n tarba, ayen i waliɣ d wayen i sliɣ later deg chats, audios, videos d materials nniḍen.</p><p>Awal yella aṭas ɣef tayri, zwaj, tarwa d yimal. Llant hearts, ismawen n lḥnana d wawalen i fhemɣ am love declarations. Ur lliɣ ara kan ttḥemmileɣ amlal; bdiɣ ttḥemmileɣ tikli ɣer xtuba d zwaj.</p><p>S wakud, awal yuɣal d uslig ugar, armi d imeslayen erotic d phone sex. Taqrabt n lḥess, lemɛahda n zwaj d intimacy rnant iyi laman belli netteddun ɣer relation ثابت d zwaj.</p><h2>Tayri, idrimen d yimal</h2><p>Tella daɣen tmeslayt ɣef yidrimen: dwa, tilifun, creams, lehdur d yiḥricen nniḍen. Uzneɣ idrimen acku lliɣ ttḥseb belli ttɛawaneɣ tamettut i ḥemmleɣ d win i bɣiɣ ad zzewjeɣ. I nek, tallelt-agi tella d aḥric n relation i ḥesbeɣ d serious.</p><p>I safari ɣer Dzayer, Yasmine tesuter ad d-kreɣ apartement uslig, ad ttḥeqquɣ belli visiteurs ttwasirgen. Tenna-yi belli akka nezmer ad nemlal s shala ugar, ad nili s lḥurriya d lehna war win ara aɣ-d-iceɣben. Tesuter daɣen ad d-seggmeɣ voiture n location akken ad nili d ilelliyen deg tikli.</p><p>I nek, apartement ur yelli ara kan i yidles. Yella i wakken ad nemlal u ad nili s lehna yid-s. S usuter n voiture n location, aya yella am planning s telqayt i wakud nneɣ deg Dzayer.</p><p>Seɣmeɣ safari d apartement ɣef wayen i d-nemmeslay. Ur ḥesbeɣ ara belli d urar; ḥesbeɣ belli d abrid ɣer zwaj.</p><div class="strong">Ur ḥesbeɣ ara belli d urar. Ḥesbeɣ belli d abrid ɣer zwaj, u xedmeɣ ɣef waya.</div><h2>Dzayer d Jardin d’Essai</h2><p>Mi ɛeddan ugar n yiwen useggas, ruḥeɣ ɣer Dzayer. I nek, safari-agi yella d abrid seg relation n lebɛid ɣer tudert n tidet i d-nettmeslay fell-as. Mi nemlal, nemyuẓa, nemyussan, u nella deg relation intime.</p><p>Am Muslim, ur ḥesbeɣ ara aya d حاجة عادية. Sex ɣur-i ilaq ad yili deg zwaj. Ihi, mi yella yid-s lemɛahda n zwaj, fhemɣ intimacy-agi am حاجة serious.</p><p>Yasmine tebɣa ad d-tili xtuba ass i d-iteddun. Nek qebleɣ. Uqbel n waya steqsaɣ-tt ɣef anwa n خاتم n xtuba i tḥemmel d acu d lqyas-is. Ihi teẓra belli ttheyyiɣ proposal u tqebel xtuba. I nek, aya yella imṣada d wayen akk i d-tenna uqbel ɣef tayri, zwaj d yimal.</p><p>Ass nniḍen neruḥ ɣer Jardin d’Essai du Hamma. Deg wakud-nni ḥesbeɣ-t d amkan nneɣ aḥulfan. Bdiɣ daɣen ttḥemmileɣ خاتم n xtuba; cfigh belli lqyas isali s 8, u ḥesbeɣ 48 maca ur zmireɣ ara ad iniɣ 100% ɣef yiwen n uṭṭun-a.</p><p>Maca uqbel ad d-yili proposal i ttheyyiɣ, ttwaaznen-iyi aṭas n materials seg tilifun n Yasmine d tmeslayt-is d yirgazen: chats, screenshots, tugniwin, audios d videos. Ayen i waliɣ d wayen i sliɣ ibeddel-iyi akk tamuɣli. Yiwen wass uqbel n proposal, beddleɣ réservation n tayri n tuffɣa u ffɣeɣ seg Dzayer zik.</p><p>Ɣur-i confirmation n ubeddel n tayri n tuffɣa, u yezmer ad d-yettwaseknen s anonymisation am preuve n chronologie. Yeskan belli ffɣeɣ seg safari uqbel n proposal i ttheyyiɣ.</p><p>Yasmine teḥmeq aṭas mi ffɣeɣ zik u ur as-xdimeɣ ara proposal n xtuba. I nek, chronologie-a tesɛa azal: armi d lawan i yi-d-wḍen materials, lliɣ mazal ttheyyiɣ xtuba. Materials i yi-d-ttwaznen i beddlen decision-iw.</p><h2>Ayen i waliɣ later</h2><p>Later, waliɣ ayen yellan deg tilifun n Yasmine, s waṭas messages-is d contacts n yirgazen. Waliɣ chats, screenshots, tugniwin, audios d videos. Meslayeɣ daɣen d yirgazen nniḍen i yi-d-yesseknen iznan, tugniwin d termitin-nsen.</p><p>I nek, aya ur yelli ara d rumor n social media. Yella d material seg tilifun n Yasmine d tmeslayt-is direct d yirgazen. S yal material amaynut, tamuɣli-iw ɣef relation tbeddel.</p><p>Deg tmuɣli-iw ɣef material, kra n wakud yella qrib 50 contacts n yirgazen deg yiwen wakud, d meyya ɣef wakud meqqren. Uṭṭun-a d assessment-iw n material, mačči belli yal contact yesɛa yiwen lmaɛna.</p><div class="strong">I nek, tidet i yeqreḥen d: lliɣ d yiwen gar waṭas.</div><p>Kra n contacts ur ttwaseklen ara s yismawen n tidet. Ismawen n lḥnana ttuɣalen-d aṭas. Hatta isem-iw nek yura-t yiwet n tikkelt s tucḍa mi ɛeddan aṭas n wussan.</p><p>Irgazen nniḍen ḥkan-iyi ɣef imlilen, romantic messages d contacts intimes neɣ sexuels. Kra seg-sen sseknen-iyi messages neɣ tugniwin-nsen. Jardin d’Essai du Hamma yella daɣen deg kra n tmacahin-nsen.</p><p>Seg messages, tugniwin d yimmeslayen-iw d yirgazen nniḍen, fhemɣ belli Yasmine tesɛa yakan partenaires sexuels uqbel-iw, u kra n contacts intimes neɣ sexuels llan deg yiwen wakud anda i yi-d-tettini tayri, laman d zwaj.</p><p>Amenḍar n wakud yesɛa azal ɣur-i. Ugur ur yelli ara kan d wayen i d-yellan uqbel ma nessen, maca d wayen i d-yellan deg wakud anda i ḥesbeɣ belli nettwaɛahad i zwaj.</p><h2>Acuɣer aya yesɛa azal i zwaj</h2><p>I nek, الماضي الجنسي, lɛafya, laman d exclusivité d isental i ilaq sin n yimdanen ad ssnen s tidet send zwaj. Mačči akken ad nḥeqreɣ yiwen ɣef الماضي-is.</p><p>Ugur ameqqran d حق-iw ad ssneɣ isallen i yesɛan azal i tikti-iw send xtuba. Ala s waya i zemreɣ ad ferneɣ s lḥurriya ma relation d zwaj-a lhan-iyi neɣ ala.</p><p>Ma yiwen yettmeslay ɣef zwaj, laman d tarwa, maca kra n isallen imeqqranen ɣef contacts r
