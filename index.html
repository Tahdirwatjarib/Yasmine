story:()=>`<div class="intro">Dies ist meine persönliche Darstellung dessen, was ich erlebt, gelesen, gesehen und später mit anderen Beteiligten besprochen habe. Ich schreibe nicht, um Hass zu erzeugen, sondern weil ich rückblickend gern früher die Informationen gehabt hätte, die meine Entscheidung über Liebe, Verlobung und Ehe verändert hätten.</div>${commonQuran.de}
<h2>Wie alles begann</h2><p>Wir lernten uns über Muslima.com kennen – eine Plattform, auf der viele Menschen nach einer ernsthaften muslimischen Ehe suchen. Über mehr als ein Jahr hatten wir nahezu täglich Kontakt, oft mit langen Telefon- und Videoanrufen.</p><p>Es ging um Liebe, Heirat, Kinder und eine gemeinsame Zukunft. Mit der Zeit wurden die Gespräche zunehmend intim, einschließlich erotischer Telefonate und Telefonsex. Worte wie „Aktar, aktar, aktar – mehr, mehr, mehr“ und „Ya omri – mein Leben“ blieben mir im Gedächtnis.</p>
<h2>Liebe, Geld und konkrete Zukunftspläne</h2><p>Parallel kamen immer wieder finanzielle Themen: Medikamente, Telefon, Cremes, Geschenke und andere Ausgaben. Ich schickte Geld und Geschenke, weil ich glaubte, einer Frau zu helfen, die ich liebte und mit der ich eine Zukunft plante.</p><p>Für meine Reise nach Algier bat sie mich, eine private Wohnung zu mieten und vorher sicherzustellen, dass Besucher erlaubt seien. Auch ein Mietwagen sollte organisiert werden.</p><div class="strong">Ich glaubte nicht an ein Spiel. Ich glaubte an eine zukünftige Ehe.</div>
<h2>Algier, Nähe und der Tarzan-Park</h2><p>Nach mehr als einem Jahr flog ich nach Algier. Wir umarmten und küssten uns und hatten Sex. Für mich als Muslim war das keine belanglose Begegnung. Sex gehört für mich eigentlich in die Ehe. Zusammen mit den fortgesetzten Heiratsversprechen deutete ich diese Nähe als Zeichen einer ernsthaften Zukunft.</p><p>Am nächsten Tag waren wir im Jardin d’Essai du Hamma. Damals dachte ich, dies sei unser besonderer romantischer Ort.</p><p>Ich dachte konkret über einen Verlobungsring nach. Bei der Ringgröße erinnere ich mich daran, dass die Zahl auf 8 endete; ich meine, dass es 48 war. Bei dieser einen Zahl bin ich heute nicht mehr hundertprozentig sicher.</p>
<h2>Was ich später entdeckte</h2><p>Später bekam ich Einblick in Chats, Screenshots, Bilder, Audios und Videos. Außerdem sprach ich mit anderen Männern, die mir eigene Nachrichten, Fotos und Erfahrungen zeigten oder beschrieben.</p><p>Mein Eindruck aus dem Material war nicht mehr, dass es sich um einzelne Missverständnisse handelte. Nach meiner Auswertung bestanden zeitweise ungefähr 50 männliche Kontakte parallel; über längere Zeit sammelten sich Hunderte Kontakte an.</p><div class="strong">Für mich war die schmerzhafte Erkenntnis klar: Ich war einer von vielen.</div><p>Viele Kontakte waren offenbar nicht einmal mit Namen gespeichert. Allgemeine Kosenamen wie „Baby“, „BB“ oder „mein Leben“ tauchten immer wieder auf. Selbst meinen Namen schrieb Yasmine nach langer Zeit einmal falsch.</p><p>Andere Männer schilderten mir Treffen, romantische Kommunikation und intime beziehungsweise sexuelle Kontakte. Auch der Jardin d’Essai du Hamma tauchte wieder auf. Nach den Nachrichten, Bildern und Gesprächen war für mich klar, dass vor mir bereits andere sexuelle Partner existiert hatten und dass intime Kontakte nach meiner Wahrnehmung teilweise in denselben Zeitraum fielen, in dem mir Liebe, Treue und Heirat versprochen wurden.</p>
<h2>Warum das für eine Ehe entscheidend ist</h2><p>Für mich sind sexuelle Vergangenheit, Keuschheit, Treue und Exklusivität Fragen, über die beide Menschen vor einer Ehe ehrlich entscheiden dürfen. Es geht nicht darum, jemanden wegen seiner Vergangenheit zu beschimpfen. Es geht darum, dass ich vor einer Verlobung die für mich entscheidenden Tatsachen kennen und selbst entscheiden durfte, wen ich heirate.</p><div class="quote">Welches Bild wird ein zukünftiger Ehemann von Yasmines Vergangenheit bekommen – und wird ihm vor seiner Entscheidung dieselbe vollständige Wahrheit zugänglich sein, die ich damals gebraucht hätte?</div>
<h2>Das Muster, das ich erlebt habe</h2><div class="phases"><div class="phase"><strong>Phase 1 – Du bist etwas ganz Besonderes</strong>Aufmerksamkeit, lange Anrufe, Herzen, Liebe, Heirat, Kinder und Zukunft.</div><div class="phase"><strong>Phase 2 – Emotionale und sexuelle Bindung</strong>Erotische Gespräche, Telefonsex, Treffen, Küsse und Sex.</div><div class="phase"><strong>Phase 3 – Ein Problem entsteht</strong>Krankheit, Medikamente, Telefon, Familie oder eine dringende Ausgabe.</div><div class="phase"><strong>Phase 4 – Geld und Geschenke</strong>Hilfe wird mit Fürsorge, Ernsthaftigkeit oder Liebe verbunden.</div><div class="phase"><strong>Phase 5 – Kälte</strong>Weniger Zeit, kürzere Antworten, weniger Herzen, Distanz.</div><div class="phase"><strong>Phase 6 – Neue Wärme</strong>Erneute Nähe, Erotik, Zukunft und Versprechen.</div></div>
<h2>Der entscheidende Punkt</h2><p>Der größte Schaden ist für mich nicht eine einzelne Zahlung und nicht ein einzelnes Geschenk. Es ist der Verlust einer informierten Entscheidung. Wer eine Ehe plant, muss wissen dürfen, in welcher Realität er seine Entscheidung trifft.</p><p>Yasmine hätte sagen können: Ich liebe dich nicht. Ich will dich nicht heiraten. Ich treffe viele andere Männer. Ich habe oder hatte parallele Beziehungen. Dann hätte es wehgetan – aber ich hätte entscheiden können.</p><div class="quote">Geld und Sex dürfen nicht als Liebe verkauft werden.</div><p>Ich frage mich bis heute: Wissen die Menschen, die Yasmine wirklich lieben, überhaupt von dieser Seite ihres Lebens? Ihre Familie ist selbstverständlich nicht automatisch für die Entscheidungen eines erwachsenen Menschen verantwortlich.</p>
<h2>Originalmaterial und Gegendarstellung</h2><p>Zu meiner Dokumentation gehören Chats, Screenshots, Bilder, Audios und Videos sowie Gespräche mit Männern, die mir eigenes Material und eigene Erfahrungen zeigten.</p><p>Wenn Yasmine einer konkreten Veröffentlichung unserer gemeinsamen privaten und intimen Kommunikation ausdrücklich und schriftlich zustimmt, bin ich bereit, dieses Material offenzulegen. Dann dürfen auch meine eigenen Worte, meine Stimme und meine Beteiligung sichtbar sein. Mir geht es dabei nicht um sexuelle Bloßstellung, sondern darum, dass Originalmaterial und Chronologie zeigen können, was tatsächlich gesagt wurde.</p><div class="quote">Die Wahrheit muss keine Angst vor dem vollständigen Zusammenhang haben.</div><p>Wenn Yasmine eine andere Version schildert, soll niemand mir einfach blind glauben. Prüft Chronologie, Nachrichten, Bilder, Audios, Videos und Zusammenhänge.</p>
<h2>Behördliche Prüfung</h2><p>Nachdem ich mit Männern gesprochen, Nachrichten und Bilder gesehen und von weiteren Treffen erfahren hatte, stellte sich für mich die Frage: Wie viele Betroffene gibt es tatsächlich? Was haben die einzelnen Männer erlebt? Welche finanziellen oder emotionalen Schäden sind entstanden? Deshalb habe ich den Sachverhalt gemeldet, damit geprüft werden kann, was belegbar und rechtlich relevant ist.</p>
<h2>Chronologie in Kurzform</h2><div class="timeline">Über ein Jahr nahezu täglicher Kontakt → Liebes- und Heiratsversprechen → zunehmend intime Telefonate und Telefonsex → Geld und Geschenke → Reiseplanung mit privatem Apartment und Mietwagen → Treffen in Algier → Küssen und Sex → romantischer Tag im Jardin d’Essai du Hamma → Gedanken an einen Verlobungsring → Entdeckung zahlreicher anderer männlicher Kontakte → Nachrichten, Bilder, Audios und Videos → Gespräche mit weiteren Männern → Erkenntnis, dass ich einer von vielen war.</div>
<h2>Was mich am meisten verletzt hat</h2><p>Nicht das Geld. Nicht die Geschenke. Es war das Vertrauen. Mehr als ein Jahr meines Lebens hing an der Vorstellung von Liebe, Verlobung, Ehe und Familie. Als dieses Bild zerbrach, war das für mich tief verletzend.</p><p>Und ja, ich habe wegen Yasmine geweint.</p><p>Gerade eine muslimische Plattform erzeugt zusätzlich Vertrauen. Man erwartet Amanah – Vertrauenswürdigkeit. Am Ende kennt nur Allah die Herzen.</p>
<h2>Was ich anderen Männern raten würde</h2><p>Seid aufmerksam, wenn sehr früh von großer Liebe, Ehe und Kindern gesprochen wird; wenn gleichzeitig starke sexuelle Bindung entsteht; wenn immer wieder finanzielle Probleme auftauchen; wenn Geld oder Geschenke zu einem Beweis von Liebe werden; wenn nach einem Nein plötzlich Kälte entsteht; oder wenn Namen und Geschichten durcheinandergeraten.</p><div class="strong">Meine Loyalität macht einen anderen Menschen nicht loyal. Meine Ehrlichkeit macht einen anderen Menschen nicht ehrlich. Meine Liebe zwingt niemanden dazu, mich zu lieben. Liebe ist kein Vertrag, den einer alleine unterschreiben kann.</div>`,

caps:["Yasmine knows the effect she can have on men – that is how I experienced her self-presentation.","Jardin d’Essai du Hamma, often associated with the old Tarzan films. In my experience, a place Yasmine liked for romantic meetings.","An example from our chat: her phone was supposedly broken.","Yasmine at one of her meetings.","Another chat about collecting money for a new phone.","One of many chats I later saw: romantic language and the planning of another meeting.","Another chat discussing contact, a meeting point and travel arrangements.","An Instagram story with a kitten on her lap. To me, the presentation felt deliberately flirtatious and suggestive – that is my personal interpretation.","Yasmine with one of her contacts in Jardin d’Essai du Hamma. I found it striking that the same romantic place appeared to play a role with other contacts as well.","One of at least two Muslima.com accounts that I associated with Yasmine.","Yasmine tells me that she likes kissing at any time.","When I did not contact her for several days, she reacted very emotionally and demanded daily attention. I later felt I recognised similar patterns in other chats.","No words: an intimate message from our chat that affected me deeply.","Another intimate chat about kissing, physical closeness and the idea of having a child together."],
story:()=>`<div class="intro">This is my personal account of what I experienced, read, saw and later discussed with other people involved. I am not writing to create hatred, but because I wish I had known earlier the information that would have changed my decisions about love, engagement and marriage.</div>${commonQuran.en}
<h2>How it began</h2><p>We met on Muslima.com and were in contact almost every day for more than a year, often through long calls and video calls. We spoke about love, marriage, children and a shared future. Over time the conversations also became increasingly intimate, including erotic calls and phone sex.</p>
<h2>Love, money and concrete plans</h2><p>Financial requests appeared repeatedly: medicine, a phone, creams, gifts and other expenses. I sent money and gifts because I believed I was helping a woman I loved and intended to marry.</p><p>For my trip to Algiers she asked me to rent a private apartment, make sure visitors were allowed and arrange a rental car.</p><div class="strong">I did not think I was participating in a game. I believed I was preparing for a future marriage.</div>
<h2>Algiers and intimacy</h2><p>After more than a year I flew to Algiers. We hugged, kissed and had sex. As a Muslim, I did not view that as casual. Combined with the continuing promises of marriage, I understood it as part of a serious future together.</p><p>The next day we visited Jardin d’Essai du Hamma. At the time I believed it was our special romantic place. I was already seriously thinking about an engagement ring; I remember the size ending in 8 and believe it was 48, though I am not completely certain.</p>
<h2>What I discovered later</h2><p>Later I gained access to chats, screenshots, images, audio and video. I also spoke with other men who showed or described their own messages, photos and experiences.</p><p>My impression was no longer that these were isolated misunderstandings. My own assessment was that at times around 50 male contacts existed in parallel, with hundreds accumulating over a longer period.</p><div class="strong">For me, the painful conclusion was clear: I was one of many.</div><p>Many contacts did not even appear to be saved by name. Generic pet names such as “Baby”, “BB” and “my life” appeared repeatedly. Even my own name was once written incorrectly after a long time.</p><p>Other men described meetings, romantic communication and intimate or sexual contacts. Jardin d’Essai du Hamma appeared again as well. Based on the messages, images and conversations, I concluded that there had been sexual partners before me and that some intimate contacts, as I understood the material, overlapped with the period in which I was being promised love, fidelity and marriage.</p>
<h2>Why this matters for marriage</h2><p>For me, sexual history, chastity, fidelity and exclusivity are matters on which both people deserve honest information before marriage. This is not about insulting someone for their past. It is about my right to know the facts that mattered to me before engagement and decide for myself whom I wished to marry.</p><div class="quote">What picture will a future husband receive of Yasmine's past – and before making his decision, will he have access to the same complete truth that I needed then?</div>
<h2>The pattern I experienced</h2><div class="phases"><div class="phase"><strong>Phase 1 – You are very special</strong>Attention, calls, hearts, love, marriage, children and a future.</div><div class="phase"><strong>Phase 2 – Emotional and sexual bonding</strong>Erotic talk, phone sex, meetings, kisses and sex.</div><div class="phase"><strong>Phase 3 – A problem appears</strong>Illness, medication, phone, family or another urgent expense.</div><div class="phase"><strong>Phase 4 – Money and gifts</strong>Financial help becomes linked to care, seriousness or love.</div><div class="phase"><strong>Phase 5 – Coldness</strong>Less time, shorter replies, fewer hearts and distance.</div><div class="phase"><strong>Phase 6 – Warmth returns</strong>Closeness, eroticism, future plans and promises return.</div></div>
<h2>The decisive issue</h2><p>The greatest harm for me is not one payment or one gift. It is losing the ability to make an informed choice. Yasmine could have said: I do not love you. I do not want to marry you. I meet many other men. I have or had parallel relationships. It would have hurt, but I could have decided for myself.</p><div class="quote">Money and sex should not be sold as love.</div>
<h2>Original material and another account</h2><p>My documentation includes chats, screenshots, images, audio, video and conversations with men who showed me their own material. If Yasmine expressly and in writing agrees to publication of specific shared private and intimate communication, I am prepared to disclose it, including my own words, voice and participation. The purpose would be to show context, not sexual humiliation.</p><div class="quote">Truth has no reason to fear the complete context.</div><p>If Yasmine gives a different account, nobody should simply believe me blindly. Check the chronology, messages, images, audio, video and context.</p>
<h2>Chronology in brief</h2><div class="timeline">More than a year of almost daily contact → promises of love and marriage → increasingly intimate calls and phone sex → money and gifts → private apartment and rental car → meeting in Algiers → kissing and sex → romantic day in Jardin d’Essai du Hamma → thoughts about an engagement ring → discovery of many other male contacts → messages, images, audio and video → conversations with other men → realisation that I was one of many.</div>
<h2>What hurt most</h2><p>It was not the money or the gifts. It was the trust. I invested more than a year in the belief that this was about love, engagement, marriage and family. When that picture collapsed, it hurt deeply.</p><p>And yes, I cried because of Yasmine.</p><div class="strong">My loyalty does not make another person loyal. My honesty does not make another person honest. My love cannot force anyone to love me. Love is not a contract that one person can sign alone.</div>`,

caps:["Yasmine sait quel effet elle peut avoir sur les hommes – c’est ainsi que j’ai vécu sa manière de se présenter.","Jardin d’Essai du Hamma, souvent associé aux anciens films de Tarzan. D’après mon expérience, un lieu que Yasmine appréciait pour des rendez-vous romantiques.","Un exemple de notre discussion : son téléphone serait cassé.","Yasmine lors de l’un de ses rendez-vous.","Une autre conversation au sujet d’argent destiné à un nouveau téléphone.","L’une des nombreuses conversations que j’ai vues ensuite : langage romantique et préparation d’une nouvelle rencontre.","Une autre conversation où sont discutés le contact, le lieu de rendez-vous et le déplacement.","Story Instagram avec un chaton sur ses genoux. Pour moi, la mise en scène semblait volontairement séduisante et suggestive – c’est mon interprétation personnelle.","Yasmine avec l’un de ses contacts au Jardin d’Essai du Hamma. J’ai trouvé frappant que le même lieu romantique semble également apparaître avec d’autres contacts.","L’un d’au moins deux comptes Muslima.com que j’ai associés à Yasmine.","Yasmine m’écrit qu’elle aime embrasser à tout moment.","Lorsque je ne l’ai pas contactée pendant quelques jours, elle a réagi de manière très émotionnelle et a exigé une attention quotidienne. J’ai ensuite cru reconnaître des schémas semblables dans d’autres conversations.","Sans commentaire : un message intime de notre conversation qui m’a particulièrement touché.","Une autre conversation intime sur les baisers, la proximité physique et l’idée d’avoir un enfant ensemble."],
story:()=>`<div class="intro">Ceci est mon récit personnel de ce que j’ai vécu, lu, vu et ensuite discuté avec d’autres personnes concernées. Je n’écris pas pour susciter la haine, mais parce que j’aurais voulu disposer plus tôt des informations qui auraient changé mes décisions concernant l’amour, les fiançailles et le mariage.</div>${commonQuran.fr}
<h2>Comment tout a commencé</h2><p>Nous nous sommes connus sur Muslima.com. Pendant plus d’un an, nous avons été en contact presque chaque jour, avec de longs appels et de nombreux appels vidéo. Nous parlions d’amour, de mariage, d’enfants et d’un avenir commun. Avec le temps, les échanges sont devenus de plus en plus intimes, y compris des conversations érotiques et du sexe au téléphone.</p>
<h2>Amour, argent et projets concrets</h2><p>Des sujets financiers revenaient : médicaments, téléphone, crèmes, cadeaux et autres dépenses. J’ai envoyé de l’argent et des cadeaux parce que je croyais aider une femme que j’aimais et avec laquelle j’envisageais le mariage.</p><p>Pour mon voyage à Alger, elle m’a demandé de louer un appartement privé, de vérifier que les visiteurs étaient autorisés et d’organiser une voiture.</p><div class="strong">Je ne pensais pas participer à un jeu. Je croyais préparer un futur mariage.</div>
<h2>Alger, intimité et Jardin d’Essai</h2><p>Après plus d’un an, je suis allé à Alger. Nous nous sommes embrassés et nous avons eu des relations sexuelles. En tant que musulman, je ne considérais pas cela comme banal. Avec les promesses répétées de mariage, j’ai interprété cette intimité comme le signe d’un avenir sérieux.</p><p>Le lendemain, nous sommes allés au Jardin d’Essai du Hamma. À ce moment-là, je pensais que c’était notre lieu romantique particulier. Je pensais déjà à une bague de fiançailles ; je crois que la taille était 48, sans en être aujourd’hui totalement certain.</p>
<h2>Ce que j’ai découvert ensuite</h2><p>Plus tard, j’ai eu accès à des conversations, captures d’écran, images, audios et vidéos. J’ai aussi parlé avec d’autres hommes qui m’ont montré ou décrit leurs propres messages, photos et expériences.</p><p>Selon mon analyse, il y avait parfois environ 50 contacts masculins en parallèle et, sur une période plus longue, des centaines.</p><div class="strong">Pour moi, la conclusion douloureuse était claire : j’étais l’un parmi beaucoup d’autres.</div><p>De nombreux contacts ne semblaient pas enregistrés par leur nom et des surnoms génériques revenaient souvent. D’autres hommes m’ont parlé de rencontres, de communication romantique et de contacts intimes ou sexuels. Le Jardin d’Essai du Hamma est également réapparu.</p>
<h2>Pourquoi cela compte avant le mariage</h2><p>Pour moi, le passé sexuel, la chasteté, la fidélité et l’exclusivité sont des sujets sur lesquels deux personnes doivent pouvoir décider honnêtement avant le mariage. Il ne s’agit pas d’insulter quelqu’un pour son passé, mais de mon droit à connaître les faits importants pour ma décision.</p><div class="quote">Quelle image un futur mari recevra-t-il du passé de Yasmine – et aura-t-il, avant de décider, accès à la même vérité complète dont j’aurais eu besoin ?</div>
<h2>Le schéma que j’ai vécu</h2><div class="phases"><div class="phase"><strong>Phase 1 – Tu es quelqu’un de très spécial</strong>Attention, appels, cœurs, amour, mariage, enfants et avenir.</div><div class="phase"><strong>Phase 2 – Lien émotionnel et sexuel</strong>Érotisme, sexe au téléphone, rencontres, baisers et sexe.</div><div class="phase"><strong>Phase 3 – Un problème apparaît</strong>Maladie, médicaments, téléphone, famille ou dépense urgente.</div><div class="phase"><strong>Phase 4 – Argent et cadeaux</strong>L’aide financière devient liée à l’affection ou à l’amour.</div><div class="phase"><strong>Phase 5 – Froideur</strong>Moins de temps, réponses plus courtes, distance.</div><div class="phase"><strong>Phase 6 – Retour de la chaleur</strong>Proximité, érotisme, avenir et promesses reviennent.</div></div>
<h2>Le point décisif</h2><p>Pour moi, le plus grand dommage n’est pas un paiement ou un cadeau. C’est la perte d’un choix éclairé. Yasmine aurait pu dire qu’elle ne m’aimait pas, qu’elle ne voulait pas m’épouser ou qu’elle avait d’autres relations. Cela aurait fait mal, mais j’aurais pu décider moi-même.</p><div class="quote">L’argent et le sexe ne doivent pas être vendus comme de l’amour.</div>
<h2>Documents originaux et autre version</h2><p>Ma documentation comprend chats, captures, images, audios, vidéos et conversations avec d’autres hommes. Si Yasmine accepte expressément et par écrit la publication précise de notre communication privée et intime, je suis prêt à la montrer, y compris mes propres paroles, ma voix et ma participation. L’objectif serait de montrer le contexte, pas d’humilier sexuellement.</p><div class="quote">La vérité n’a pas à craindre le contexte complet.</div><p>Si Yasmine raconte une autre version, personne ne doit simplement me croire aveuglément : vérifiez chronologie, messages, images, audios, vidéos et contexte.</p>
<h2>Chronologie résumée</h2><div class="timeline">Plus d’un an de contact presque quotidien → promesses d’amour et de mariage → appels intimes et sexe au téléphone → argent et cadeaux → appartement privé et voiture → rencontre à Alger → baisers et sexe → Jardin d’Essai du Hamma → idée d’une bague → découverte de nombreux autres contacts masculins → messages, images, audios et vidéos → échanges avec d’autres hommes → prise de conscience que j’étais l’un parmi beaucoup d’autres.</div>
<h2>Ce qui m’a le plus blessé</h2><p>Ce n’était ni l’argent ni les cadeaux. C’était la confiance. J’ai investi plus d’un an dans l’idée d’un amour, de fiançailles, d’un mariage et d’une famille. Quand cette image s’est effondrée, cela m’a profondément blessé.</p><p>Et oui, j’ai pleuré à cause de Yasmine.</p><div class="strong">Ma loyauté ne rend pas une autre personne loyale. Mon honnêteté ne rend pas une autre personne honnête. Mon amour ne peut obliger personne à m’aimer. L’amour n’est pas un contrat qu’une seule personne peut signer.</div>`,

forumTitle:"شارك تجربتك",forumText:"يمكن لمن يرغب في سرد تجربته استخدام المنتدى الخارجي بالعربية أو الفرنسية أو القبائلية أو الإنجليزية أو الألمانية.",forumBtn:"الدخول إلى منتدى التجارب",commentsTitle:"التعليقات",commentsHelp:"يمكن للزوار التعليق هنا من دون إنشاء حساب. وقد تخضع التعليقات للمراجعة قبل النشر. يُرجى عدم نشر بيانات اتصال خاصة بأشخاص آخرين.",legalTitle:"ملاحظات حول الصور والخصوصية والتبليغ",closing:"لو قالت لي ياسمين الحقيقة كاملة منذ البداية، ربما كانت ستخسر حبي، لكنها كانت ستحتفظ باحترامي.",footer:"رواية تجربة شخصية · 2026",reportBtn:"⚑ الإبلاغ عن محتوى",reportTitle:"الإبلاغ عن محتوى",reportHelp:"يرجى تحديد الصورة أو الفقرة المقصودة بدقة.",name:"الاسم (اختياري)",email:"البريد الإلكتروني",reason:"السبب",message:"الرسالة",send:"إرسال البلاغ",reasons:["يرجى الاختيار","الخصوصية / صورة","معلومة خاطئة أو مضللة","روايتي / حقي في الرد","سبب آخر"],
caps:["ياسمين تعرف التأثير الذي يمكن أن تتركه على الرجال – هكذا عشت طريقة تقديمها لنفسها.","حديقة التجارب بالحامة، المرتبطة لدى كثيرين بأفلام طرزان القديمة. بحسب تجربتي، كانت ياسمين تحب هذا المكان للقاءات الرومانسية.","مثال من محادثتنا: هاتفها كان، بحسب ما قيل لي، معطلاً.","ياسمين في أحد لقاءاتها.","محادثة أخرى حول جمع المال لشراء هاتف جديد.","واحدة من محادثات كثيرة رأيتها لاحقاً: كلام رومانسي وترتيب لقاء آخر.","محادثة أخرى يجري فيها الحديث عن الاتصال ومكان اللقاء وطريقة الوصول.","قصة على إنستغرام مع قطة صغيرة على حجرها. بالنسبة لي بدا العرض مقصوداً ليكون جذاباً وذا إيحاء – وهذا تفسيري الشخصي.","ياسمين مع أحد معارفها في حديقة التجارب بالحامة. لفت انتباهي أن المكان الرومانسي نفسه بدا حاضراً أيضاً مع معارف آخرين.","أحد حسابين على الأقل في Muslima.com ربطتهما بياسمين.","ياسمين تكتب لي أنها تحب التقبيل في أي وقت.","عندما لم أتواصل معها عدة أيام، ردت بعاطفة شديدة وطالبت باهتمام يومي. لاحقاً شعرت أنني رأيت أنماطاً مشابهة في محادثات أخرى.","بلا تعليق: رسالة حميمة من محادثتنا أثرت فيّ كثيراً.","محادثة حميمة أخرى عن التقبيل والقرب الجسدي وفكرة إنجاب طفل معاً."],
story:()=>`<div class="intro">هذه روايتي الشخصية لما عشته وقرأته ورأيته ثم ناقشته لاحقاً مع أشخاص آخرين معنيين. لا أكتب من أجل نشر الكراهية، بل لأنني كنت أتمنى لو عرفت في وقت أبكر المعلومات التي كانت ستغيّر قراري بشأن الحب والخطوبة والزواج.</div>${commonQuran.ar}
<h2>كيف بدأت القصة</h2><p>تعرفنا عبر Muslima.com. لأكثر من سنة كنا نتواصل تقريباً كل يوم، بمكالمات طويلة ومكالمات فيديو. كان الحديث عن الحب والزواج والأطفال والمستقبل المشترك. ومع الوقت أصبح التواصل أكثر حميمية، بما في ذلك مكالمات ذات طابع جنسي وعلاقة جنسية عبر الهاتف.</p>
<h2>الحب والمال وخطط المستقبل</h2><p>ظهرت مراراً مواضيع مالية: دواء، هاتف، كريمات، هدايا ومصاريف أخرى. أرسلت المال والهدايا لأنني كنت أعتقد أنني أساعد امرأة أحبها وأفكر في الزواج منها.</p><p>قبل رحلتي إلى الجزائر العاصمة طلبت مني استئجار شقة خاصة والتأكد من السماح بالزوار، وكذلك ترتيب سيارة مستأجرة.</p><div class="strong">لم أعتقد أنني داخل لعبة. كنت أعتقد أنني أستعد لزواج مستقبلي.</div>
<h2>الجزائر العاصمة والقرب</h2><p>بعد أكثر من عام سافرت إلى الجزائر العاصمة. تعانقنا وتبادلنا القبل ومارسنا الجنس. كمسلم، لم أعتبر ذلك لقاءً عادياً. ومع استمرار وعود الزواج، فهمت هذه العلاقة الحميمة على أنها جزء من مستقبل جاد.</p><p>في اليوم التالي ذهبنا إلى حديقة التجارب بالحامة. في ذلك الوقت كنت أظن أنها مكاننا الرومانسي الخاص. وكنت أفكر فعلاً في خاتم خطوبة؛ أظن أن المقاس كان 48، لكنني لم أعد متأكداً مئة بالمئة.</p>
<h2>ما اكتشفته لاحقاً</h2><p>لاحقاً اطلعت على محادثات ولقطات شاشة وصور وتسجيلات صوتية وفيديوهات. كما تحدثت مع رجال آخرين أظهروا لي أو وصفوا لي رسائلهم وصورهم وتجاربهم.</p><p>بحسب تقييمي، كان العدد في بعض الفترات يقارب 50 اتصالاً متوازياً مع رجال، وعلى مدى أطول تراكمت مئات الاتصالات.</p><div class="strong">بالنسبة لي كانت النتيجة المؤلمة واضحة: كنت واحداً من كثيرين.</div><p>عدد من الاتصالات لم يكن محفوظاً بأسماء واضحة، وتكررت أسماء تدليل عامة. كما تحدث رجال آخرون عن لقاءات وكلام رومانسي واتصالات حميمة أو جنسية، وظهر اسم حديقة التجارب بالحامة أيضاً.</p>
<h2>لماذا هذا مهم قبل الزواج</h2><p>بالنسبة لي، الماضي الجنسي والعفة والوفاء والحصرية أمور يحق للطرفين أن يعرفا حقيقتها قبل الزواج. لا يتعلق الأمر بإهانة إنسان بسبب ماضيه، بل بحقي في معرفة الحقائق المهمة لقراري قبل الخطوبة.</p><div class="quote">أي صورة سيحصل عليها زوج ياسمين المستقبلي عن ماضيها؟ وهل ستتاح له قبل قراره الحقيقة الكاملة نفسها التي كنت أحتاجها أنا؟</div>
<h2>النمط الذي عشته</h2><div class="phases"><div class="phase"><strong>المرحلة 1 – أنت شخص مميز جداً</strong>اهتمام، مكالمات، قلوب، حب، زواج، أطفال ومستقبل.</div><div class="phase"><strong>المرحلة 2 – ارتباط عاطفي وجنسي</strong>حديث جنسي، علاقة عبر الهاتف، لقاءات، قبل وجنس.</div><div class="phase"><strong>المرحلة 3 – ظهور مشكلة</strong>مرض، دواء، هاتف، عائلة أو مصروف عاجل.</div><div class="phase"><strong>المرحلة 4 – المال والهدايا</strong>المساعدة المالية ترتبط بالاهتمام أو الحب.</div><div class="phase"><strong>المرحلة 5 – البرود</strong>وقت أقل وردود أقصر ومسافة أكبر.</div><div class="phase"><strong>المرحلة 6 – عودة الدفء</strong>عودة القرب والإثارة والحديث عن المستقبل.</div></div>
<h2>المشكلة الأساسية</h2><p>أكبر ضرر بالنسبة لي ليس دفعة مالية ولا هدية، بل ضياع القرار المبني على معرفة كاملة. كان يمكن لياسمين أن تقول إنها لا تحبني أو لا تريد الزواج مني أو أن لديها علاقات أخرى. كان ذلك سيؤلمني، لكنه كان سيتركني أقرر بنفسي.</p><div class="quote">لا ينبغي بيع المال والجنس على أنهما حب.</div>
<h2>المواد الأصلية والرواية الأخرى</h2><p>توثيقي يشمل محادثات ولقطات شاشة وصوراً وتسجيلات صوتية وفيديوهات، إضافة إلى محادثات مع رجال آخرين. إذا وافقت ياسمين بشكل صريح وخطي على نشر جزء محدد من تواصلنا الخاص والحميم، فأنا مستعد لكشفه بما في ذلك كلماتي وصوتي ومشاركتي. الهدف هو إظهار السياق لا الإذلال الجنسي.</p><div class="quote">الحقيقة لا تخاف من السياق الكامل.</div><p>إذا قدمت ياسمين رواية مختلفة، فلا أطلب من أحد أن يصدقني بصورة عمياء. افحصوا التسلسل الزمني والرسائل والصور والتسجيلات والفيديوهات والسياق.</p>
<h2>التسلسل باختصار</h2><div class="timeline">أكثر من سنة من التواصل شبه اليومي → وعود بالحب والزواج → مكالمات أكثر حميمية وعلاقة عبر الهاتف → مال وهدايا → شقة خاصة وسيارة → لقاء في الجزائر العاصمة → قبل وجنس → حديقة التجارب بالحامة → التفكير في خاتم → اكتشاف عدد كبير من الاتصالات مع رجال → رسائل وصور وصوت وفيديو → حديث مع رجال آخرين → إدراكي أنني كنت واحداً من كثيرين.</div>
<h2>ما آذاني أكثر</h2><p>لم يكن المال ولا الهدايا. كانت الثقة. استثمرت أكثر من عام وأنا أؤمن بالحب والخطوبة والزواج والأسرة. عندما انهارت هذه الصورة تألمت بشدة.</p><p>ونعم، بكيت بسبب ياسمين.</p><div class="strong">وفائي لا يجعل شخصاً آخر وفياً. صدقي لا يجعل شخصاً آخر صادقاً. حبي لا يجبر أحداً على أن يحبني. الحب ليس عقداً يستطيع شخص واحد توقيعه بمفرده.</div>`,
legal:`<div class="legalcard"><strong>§ 1 – الأماكن</strong><br>تُذكر بوروبة وبوبكر والحراش والجزائر العاصمة فقط عندما تكون ذات صلة بالسياق.</div><div class="legalcard"><strong>§ 2 – الصور</strong><br>تحتوي الصفحة على صور عادية ولقطات شاشة مرتبطة بهذه الرواية الشخصية. حقوق المصور وحقوق الأشخاص الظاهرين مسألتان منفصلتان.</div><div class="legalcard"><strong>§ 3 – إخفاء الهوية</strong><br>كلما كان ذلك ممكناً، يتم إخفاء الأشخاص غير المعنيين وأرقام الهواتف وبيانات الاتصال والمعلومات الخاصة.</div><div class="legalcard"><strong>§ 4 – الاعتراض والإزالة</strong><br>يمكن استخدام زر الإبلاغ لطلب مراجعة صورة أو فقرة محددة. وبعد المراجعة يمكن تعديل المحتوى أو إخفاء الهوية أو الإزالة عند الحاجة.</div>`

caps:["Yasmine teẓra amek ara d-tban i yirgazen – akka i lliɣ tt-waliɣ deg uskan-is.","Jardin d’Essai du Hamma, amkan i d-ttemmeslayen ɣef Tarzan. Deg termit-iw, d amkan i tḥemmel i yimlilen iḥulfanen.","Amedya seg chat-nneɣ: tilifun-is, akka i d-tenna, yerreẓ.","Yasmine deg yiwen seg yimlilen-is.","Chat nniḍen ɣef ujemmeɛ n yidrimen i tilifun amaynut.","Yiwen seg chats i waliɣ later: awal aḥulfan d useggem n yimlil nniḍen.","Chat nniḍen anda i d-ttmeslayen ɣef contact, amkan n yimlil d abrid.","Story n Instagram s umcic ameẓyan ɣef yiɣil-is. Nek waliɣ-as talɣa i d-yettawin lwelha – d tamuɣli-iw kan.","Yasmine d yiwen seg contacts-is deg Jardin d’Essai du Hamma. Isteqsa-yi mi waliɣ amkan-a yella daɣen deg yimlilen nniḍen.","Yiwen seg sin accounts n Muslima.com i qqneɣ ɣer Yasmine.","Yasmine taru-yi belli tḥemmel leqbel yal tikelt.","Mi ur as-d-mmeslayeɣ ara kra n wussan, terra s waṭas n lḥess d usuter n lwelha yal ass. Later, waliɣ amecwar am wagi deg chats nniḍen.","War awal: izen uslig seg chat-nneɣ i yi-yeḥzen aṭas.","Chat uslig nniḍen ɣef leqbel, lqرب d tikti n tarwa s tayri."],
story:()=>`<div class="intro">Wagi d wayen i ḥḍreɣ nek: ayen i ɣriɣ, i waliɣ d wayen i d-nniɣ d yimdanen nniḍen. Ur ttaruɣ ara akken ad d-awiɣ lkarh; ttaruɣ acku lemmer ssneɣ aya zik, tikti-iw ɣef tayri, xtuba d zwaj tili tesɛa talɣa nniḍen.</div>${commonQuran.kab}
<h2>Amek i tebda</h2><p>Nemlal deg Muslima.com. Ugar n yiwen useggas, qrib yal ass, nettmeslay s tilifun d video. Awal yella ɣef tayri, zwaj, tarwa d yimal. S wakud, awal yuɣal d uslig ugar, armi d imeslayen erotic d phone sex.</p>
<h2>Tayri, idrimen d yimal</h2><p>Tella daɣen tmeslayt ɣef yidrimen: dwa, tilifun, creams, lehdur d yiḥricen nniḍen. Uzneɣ idrimen acku lliɣ ttḥseb belli ttɛawaneɣ tamettut i ḥemmleɣ d win i bɣiɣ ad zzewjeɣ.</p><p>I safari ɣer Dzayer, tesuter apartement uslig, visiteurs d voiture n location.</p><div class="strong">Ur ḥesbeɣ ara belli d urar. Ḥesbeɣ belli d abrid ɣer zwaj.</div>
